      var k = ev.target.closest('.stempel'); if (!k) return;
      var nr = +k.dataset.etappe;
      R.stempels[nr] = !R.stempels[nr];
      if (R.voorbeeld) bewaar('voorbeeldstempels', R.stempels); else bewaar('reis', R);
      k.classList.toggle('gezet', !!R.stempels[nr]); k.classList.remove('nieuw');
      if (R.stempels[nr]) { void k.offsetWidth; k.classList.add('nieuw'); }
      var i = r.reeks.findIndex(function (et) { return et.volgorde === nr; });
      k.querySelector('span').innerHTML = '<b>' + e(naam(r.reeks[i].naar)) + '</b>' + e(stempelTekst(R.stempels[nr], i));
      var gedaan = r.reeks.filter(function (et) { return R.stempels[et.volgorde]; }).length;
      document.getElementById('stempelteller').textContent = tf('Stempelkaart · {a} van {b}', { a: gedaan, b: r.reeks.length });
      if (R.stempels[nr] && gedaan === r.reeks.length) feest();
    });
  }
  function feest() {
    var kleuren = ['#c4522f', '#e5a842', '#4fb3bf', '#6b8f5e', '#0d4a57', '#ffffff'];
    var zachter = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    for (var i = 0; !zachter && i < 120; i++) {
      var c = document.createElement('i'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw'; c.style.background = kleuren[i % kleuren.length];
      c.style.animationDuration = 2.5 + Math.random() * 2.5 + 's'; c.style.animationDelay = Math.random() * .8 + 's';
      document.body.appendChild(c); setTimeout(function (x) { x.remove(); }, 6000, c);
    }
    var v = document.createElement('div'); v.className = 'felicitatie';
    v.innerHTML = '<div><div style="font-size:3rem" aria-hidden="true">🏅</div><h2>Parabéns!</h2><p>' + e(t('Alle stempels zijn binnen. Je oorkonde staat klaar.')) + '</p><a class="knop" href="#oorkonde">' + e(t('Naar je oorkonde')) + '</a> <button class="knop knop-licht" type="button">' + e(t('Later')) + '</button></div>';
    v.addEventListener('click', function (ev) { if (ev.target === v || ev.target.tagName === 'BUTTON' || ev.target.tagName === 'A') v.remove(); });
    document.body.appendChild(v);
  }
  function oorkonde() {
    var R = reisData(), r = maakPlan(R.plan);
    var klaar = r.reeks.every(function (et) { return R.stempels[et.volgorde]; });
    var nog = r.reeks.filter(function (et) { return !R.stempels[et.volgorde]; }).length;
    var namen = [R.naam].concat(R.genoten ? R.genoten.split(',').map(function (x) { return x.trim(); }).filter(Boolean) : []);
    var laatste = r.dagen.filter(function (d) { return d.soort === 'loop'; }).pop().datum;
    var merk = I.site_naam.toUpperCase();
    var tegel = '<svg class="azulejo %c" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" fill="#fff"/><path d="M0 0h120v120H0z" fill="none" stroke="#1f4f8a" stroke-width="4"/><circle cx="0" cy="0" r="44" fill="none" stroke="#1f4f8a" stroke-width="3"/><circle cx="0" cy="0" r="30" fill="#1f4f8a"/><path d="M60 18c8 16 8 26 0 42-8-16-8-26 0-42zM18 60c16-8 26-8 42 0-16 8-26 8-42 0zM102 60c-16 8-26 8-42 0 16-8 26-8 42 0zM60 102c-8-16-8-26 0-42 8 16 8 26 0 42z" fill="#2a6cb0"/><circle cx="60" cy="60" r="7" fill="#e5a842"/><circle cx="120" cy="120" r="30" fill="none" stroke="#1f4f8a" stroke-width="3"/></svg>';
    var gelopen = tf(namen.length > 1 ? "te voet de Fishermen's Trail hebben gelopen, van {a} naar {b}, over kliffen, door mul zand en langs een van de wildste kusten van Europa." : "te voet de Fishermen's Trail heeft gelopen, van {a} naar {b}, over kliffen, door mul zand en langs een van de wildste kusten van Europa.", { a: '§a§', b: '§b§' });
    gelopen = e(gelopen).replace('§a§', '<b>' + e(naam(r.reeks[0].van)) + '</b>').replace('§b§', '<b>' + e(naam(r.eind)) + '</b>');
    return '<div class="oorkonde-pagina"><div class="oorkonde-wrap"><div class="oorkonde' + (klaar ? '' : ' concept') + '" data-concept="' + e(t('CONCEPT · nog niet alle stempels binnen')) + '">' +
      ['linksboven', 'rechtsboven', 'linksonder', 'rechtsonder'].map(function (h) { return tegel.replace('%c', h); }).join('') +
      '<p class="titel">' + e(t('Oorkonde')) + '</p><p class="sub">Trilho dos Pescadores · Costa Vicentina</p><p class="tekst" style="margin:0 0 1%">' + e(t('Hierbij verklaren wij dat')) + '</p>' +
      '<p class="namen">' + e(namen.join(' & ')) + '</p><p class="tekst">' + gelopen + '</p>' +
      '<div class="getallen"><div><b>' + r.reeks.length + '</b><span>' + e(t('etappes')) + '</span></div><div><b>' + km(r.km) + '</b><span>' + e(t('kilometer')) + '</span></div><div><b>±' + Math.round(r.km * 1350).toLocaleString(loc()) + '</b><span>' + e(t('stappen')) + '</span></div>' +
      '<div><b>' + kort(datum(R.plan.startdatum)) + ' – ' + jaar(laatste) + '</b><span>' + e(t('onderweg')) + '</span></div></div>' +
      '<svg class="zegel" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="cirkel" d="M100 100m-72 0a72 72 0 1 1 144 0a72 72 0 1 1 -144 0"/></defs><circle cx="100" cy="100" r="94" fill="none" stroke="#c4522f" stroke-width="5"/><circle cx="100" cy="100" r="84" fill="none" stroke="#c4522f" stroke-width="2"/>' +
      '<text font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#c4522f"><textPath href="#cirkel">PARABÉNS · ' + e(merk) + ' · FINISHER ·</textPath></text><path d="M62 112c10-10 20-10 30 0s20 10 30 0 20-10 26 0" stroke="#c4522f" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M70 90C82 77 109 77 123 90 109 103 82 103 70 90Z" fill="#c4522f"/><path d="M121 90 135 80l-3 10 3 10Z" fill="#c4522f"/><circle cx="79" cy="88" r="2.4" fill="#fffdf8"/>' +
      '<text x="100" y="140" text-anchor="middle" font-family="Fraunces, serif" font-size="20" font-weight="700" fill="#c4522f">' + Math.round(r.km) + ' KM</text></svg>' +
      '<p class="voetregel">' + e(merk) + ' · FISHERMEN\'S TRAIL</p></div></div><div class="oorkonde-acties">' +
      '<p style="width:100%;margin:0">' + e(klaar ? (D.printen ? t('Parabéns!') : t('Parabéns! Maak een schermafbeelding om hem te bewaren.')) : tf(nog === 1 ? 'Nog {n} stempel te gaan. Daarna verdwijnt het woord CONCEPT.' : 'Nog {n} stempels te gaan. Daarna verdwijnt het woord CONCEPT.', { n: nog })) + '</p>' +
      (D.printen ? '<button type="button" class="knop" data-print="liggend">' + e(t('Printen of opslaan als PDF')) + '</button>' : '') +
      '<a class="knop knop-licht" href="#reisboekje">' + e(t('Terug naar je reisboekje')) + '</a></div></div>';
  }

  // ---------- printen ----------
  function printen(pagina) {
    var st = document.createElement('style');
    st.textContent = '@media print { @page { ' + (pagina === 'liggend' ? 'size: A4 landscape; margin: 0' : 'size: A4 portrait; margin: 12mm') + ' } }';
    document.head.appendChild(st);
    window.print();
    setTimeout(function () { st.remove(); }, 500);
  }

  // ---------- paklijst en foto's ----------
  var PAK_ICOON = {
    'Schoenen & voeten': '<path d="M4 15c0-3 1-7 1-9h5l1 4c3 1 6 2 8 4v2H4z"/><path d="M4 18h16"/>',
    'Kleding': '<path d="M8 4l-4 3 2 4 2-1v10h8V10l2 1 2-4-4-3c-1 2-2 3-4 3S9 6 8 4z"/>',
    'Zon, wind & regen': '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
    'Rugzak & onderweg': '<path d="M7 8a5 5 0 0110 0v11H7z"/><path d="M9 8V6a3 3 0 016 0v2M10 13h4"/>',
    'Toilettas & EHBO': '<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2M12 10v6M9 13h6"/>',
    'Papieren & geld': '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/>',
    'Handig om mee te nemen': '<path d="M12 3l2.6 5.6 6 .6-4.5 4 1.3 6L12 16.3 6.6 19.2l1.3-6-4.5-4 6-.6z"/>'
  };
  function pakIcoon(g) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (PAK_ICOON[g] || PAK_ICOON['Handig om mee te nemen']) + '</svg>'; }
  function paklijst() {
    var metBagage = lees('paklijst-bagage', true), alleenMust = lees('paklijst-must', false), vinkjes = lees('paklijst', {}), eigen = lees('pak-eigen', []);
    function item(it) {
      var id = String(it.id), af = !!vinkjes[id];
      return '<label class="pak-item' + (af ? ' af' : '') + '"><input type="checkbox" data-id="' + e(id) + '"' + (af ? ' checked' : '') + '><i class="pak-vink" aria-hidden="true"></i>' +
        '<span><span class="naam">' + e(it.eigen ? it.naam : t(it.naam)) + '</span>' + (it.essentieel ? '<span class="label label-terra">must</span>' : '') +
        (it.toelichting ? '<span class="toel">' + e(t(it.toelichting)) + '</span>' : '') + '</span>' +
        (it.eigen ? '<button type="button" class="pak-weg geen-print" data-weg="' + e(id) + '" aria-label="' + e(t('Verwijderen')) + '">×</button>' : '') + '</label>';
    }
    function groepen(filter) {
      var html = D.paklijst.map(function (g) {
        var lijst = g.items.filter(filter).filter(function (it) { return !alleenMust || it.essentieel; });
        if (!lijst.length) return '';
        var af = lijst.filter(function (it) { return vinkjes[it.id]; }).length;
        return '<div class="pak-groep"><div class="pg-kop"><span class="pg-ico">' + pakIcoon(g.naam) + '</span><h3>' + e(t(g.naam)) + '</h3><span class="pg-tel' + (af === lijst.length ? ' klaar' : '') + '">' + af + '/' + lijst.length + '</span></div>' + lijst.map(item).join('') + '</div>';
      }).join('');
      return html;
    }
    function eigenBlok(plek) {
      var mijn = eigen.filter(function (x) { return !metBagage || x.plek === plek; }).map(function (x) { return { id: x.id, naam: x.naam, eigen: true }; });
      return '<div class="pak-groep pak-eigen"><div class="pg-kop"><span class="pg-ico">' + pakIcoon('') + '</span><h3>' + e(t('Zelf toegevoegd')) + '</h3></div>' + mijn.map(item).join('') +
        '<form class="pak-toevoegen geen-print" data-plek="' + plek + '"><input type="text" maxlength="60" placeholder="' + e(t('Bijvoorbeeld: oplader')) + '" aria-label="' + e(t('Zelf toevoegen')) + '"><button type="submit" class="knop knop-klein">' + e(t('Toevoegen')) + '</button></form></div>';
    }
    var tips = [['Genoeg water', 'Minstens 1,5 liter per dag: onderweg kun je bijna nergens bijvullen.'], ['Zon en wind', 'Er is vrijwel geen schaduw. Factor 30+, een pet en een windjack.'], ['Zand in je schoenen', 'Korte gamaschen schelen veel blaren op de mulle stukken.']];
    var inhoudHtml = metBagage
      ? '<div class="pak-twee"><div class="pak-kolom"><div class="pk-kop"><h2>' + e(t('In je dagrugzak')) + '</h2><p>' + e(t('Draag je elke dag bij je')) + '</p></div>' + groepen(function (it) { return it.dagrugzak; }) + eigenBlok('dagrugzak') + '</div>' +
        '<div class="pak-kolom"><div class="pk-kop"><h2>' + e(t('In je koffer')) + '</h2><p>' + e(t('Wacht elke middag in je volgende verblijf')) + '</p></div>' + groepen(function (it) { return !it.dagrugzak; }) + eigenBlok('koffer') + '</div></div>'
      : '<div class="pak-kolommen">' + groepen(function () { return true; }) + eigenBlok('alles') + '</div>';
    return '<div id="pakpagina"><section class="pak-kop"><div class="container pak-kop-binnen"><div><h1>' + e(t('Paklijst')) + '</h1><p class="intro">' + e(t('Licht lopen, niets missen.')) + '</p>' +
      '<div class="pak-schakels geen-print"><div class="segment"><button type="button" class="' + (metBagage ? 'aan' : '') + '" data-bagage="1">' + e(t('Mijn koffer gaat vooruit')) + '</button><button type="button" class="' + (metBagage ? '' : 'aan') + '" data-bagage="0">' + e(t('Ik draag alles zelf')) + '</button></div>' +
      '<label class="pak-must"><input type="checkbox" id="pak-must"' + (alleenMust ? ' checked' : '') + '> ' + e(t('Alleen must-haves')) + '</label></div></div>' +
      '<div class="pak-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring" id="pak-ring" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div><b id="pak-pct">0%</b><span id="pak-teller"></span></div></div></div></section>' +
      '<section class="sectie" style="padding-top:28px"><div class="container"><div class="pak-tips"><h2>' + e(t('Wat mensen vaak vergeten')) + '</h2>' + tips.map(function (x, i) { return '<div><b>' + (i + 1) + '. ' + e(t(x[0])) + '</b><span>' + e(t(x[1])) + '</span></div>'; }).join('') + '</div>' +
      inhoudHtml +
      '<div class="pak-acties geen-print">' + (D.printen ? '<button type="button" class="knop" data-print="staand">' + e(t('Printen')) + '</button>' : '') + '<button type="button" class="knop knop-licht" id="pak-leeg">' + e(t('Alles leegmaken')) + '</button></div></div></section></div>';
  }
  function naPaklijst() {
    var vinkjes = lees('paklijst', {});
    function teken() {
      var alle = inhoud.querySelectorAll('.pak-item input'), af = 0;
      alle.forEach(function (v) { v.closest('.pak-item').classList.toggle('af', v.checked); if (v.checked) af++; });
      var pct = alle.length ? Math.round(af / alle.length * 100) : 0;
      document.getElementById('pak-pct').textContent = pct + '%';
      document.getElementById('pak-teller').textContent = tf('{a} van {b} ingepakt', { a: af, b: alle.length });
      document.getElementById('pak-ring').setAttribute('stroke-dashoffset', (326.7 * (1 - pct / 100)).toFixed(1));
      inhoud.querySelectorAll('.pak-groep').forEach(function (g) {
        var tel = g.querySelector('.pg-tel'); if (!tel) return;
        var v = g.querySelectorAll('.pak-item input'), n = [].filter.call(v, function (x) { return x.checked; }).length;
        tel.textContent = n + '/' + v.length; tel.classList.toggle('klaar', n === v.length);
      });
    }
    var pagina = document.getElementById('pakpagina');
    pagina.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el.dataset.id) { vinkjes[el.dataset.id] = el.checked; bewaar('paklijst', vinkjes); teken(); }
      else if (el.id === 'pak-must') { bewaar('paklijst-must', el.checked); toon(true); }
    });
    pagina.addEventListener('click', function (ev) {
      var k = ev.target.closest('[data-bagage],[data-weg],#pak-leeg'); if (!k) return;
      if (k.dataset.bagage) { bewaar('paklijst-bagage', k.dataset.bagage === '1'); toon(true); }
      else if (k.dataset.weg) { ev.preventDefault(); bewaar('pak-eigen', lees('pak-eigen', []).filter(function (x) { return x.id !== k.dataset.weg; })); toon(true); }
      else { bewaar('paklijst', {}); vinkjes = {}; inhoud.querySelectorAll('.pak-item input').forEach(function (v) { v.checked = false; }); teken(); }
    });
    inhoud.querySelectorAll('.pak-toevoegen').forEach(function (f) {
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var veld = f.querySelector('input'), naam_ = veld.value.trim(); if (!naam_) return;
        var lijst = lees('pak-eigen', []); lijst.push({ id: 'e' + Date.now(), naam: naam_.slice(0, 60), plek: f.dataset.plek });
        bewaar('pak-eigen', lijst); toon(true);
      });
    });
    teken();
  }
  function fotos() {
    return '<section class="paginakop"><div class="container"><h1>' + e(t("Foto's")) + '</h1><p class="intro">' + e(t("Met dank aan de fotografen. Alle foto's staan onder een vrije licentie op Wikimedia Commons.")) + '</p></div></section>' +
      '<section class="sectie" style="padding-top:32px"><div class="container fotokaarten fotokaarten-raster">' + D.fotos.map(function (f) {
        return '<a class="fotokaart" style="aspect-ratio:4/3" href="' + e(f.bron) + '" target="_blank" rel="noopener"><img src="' + img(f, true) + '" alt="' + e(t(f.bijschrift)) + '" loading="lazy">' +
          '<div class="tekst"><h3>' + e(t(f.bijschrift)) + '</h3><span class="meta">' + e(t('Foto')) + ': ' + e(f.maker) + ' · ' + e(f.licentie) + '</span></div></a>';
      }).join('') + '</div></section>';
  }

  // ---------- vaste delen van de pagina en de taalknop ----------
  function vasteTeksten() {
    document.documentElement.lang = TAAL;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-merk]').forEach(function (el) { el.textContent = I.site_naam; });
    var knop = document.getElementById('taalknop');
    if (knop) { knop.textContent = TAAL === 'nl' ? 'EN' : 'NL'; knop.setAttribute('aria-label', TAAL === 'nl' ? 'Switch to English' : 'Naar het Nederlands'); }
    document.getElementById('voet-beheerder').textContent = I.beheerder_naam;
  }
  var taalknop = document.getElementById('taalknop');
  if (taalknop) taalknop.addEventListener('click', function () {
    TAAL = TAAL === 'nl' ? 'en' : 'nl'; bewaar('taal', TAAL); vasteTeksten(); toon();
  });

  // ---------- router ----------
  function toon(behoud) {
    var h = (location.hash || '').replace('#', '') || 'start', html, na, y = window.scrollY;
    sluitLichtbak();
    if (huidigeKaart) { try { huidigeKaart.remove(); } catch (x) { } huidigeKaart = null; }
    var m = /^etappe-(\d+)$/.exec(h);
    if (m) { html = etappePagina(+m[1]); na = naEtappe; }
    else if (h === 'route') { html = route(); na = naRoute; }
    else if (h === 'plannen') { html = plannen(); na = naPlannen; }
    else if (h === 'reisboekje') { html = reisboekje(); na = naReis; }
    else if (h === 'oorkonde') html = oorkonde();
    else if (h === 'paklijst') { html = paklijst(); na = naPaklijst; }
    else if (h === 'fotos') html = fotos();
    else html = start();
    inhoud.innerHTML = html;
    if (na) na();
    window.scrollTo({ top: behoud === true ? y : 0, behavior: 'instant' });
  }
  document.addEventListener('click', function (ev) { var k = ev.target.closest('[data-print]'); if (k) printen(k.dataset.print); });
  vasteTeksten();
  window.addEventListener('hashchange', toon);
  toon();
})();

</script>
