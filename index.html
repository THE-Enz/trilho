gage transfer", "nee": "no", "onderweg": "on the trail", "p.p.": "pp", "stappen": "steps", "stranden": "beaches", "te lopen": "to walk", "zelf dragen": "no luggage transfer", "zwaarte": "difficulty", "{a} t/m {b}": "{a} – {b}", "{a} van {b} ingepakt": "{a} of {b} packed", "{a} → {b} · {n} dagen · {k} km": "{a} → {b} · {n} days · {k} km", "{b} per persoon": "{b} per person", "{n} etappes over de kliffen, van São Torpes naar Lagos.": "{n} stages along the cliffs, from São Torpes to Lagos.", "{n} etappes, {k} km. Van São Torpes naar Lagos, over de oude paden van de vissers.": "{n} stages, {k} km. From São Torpes to Lagos, on the old paths of the fishermen.", "{n} loopdag": "{n} walking day", "{n} loopdagen": "{n} walking days", "{n} nachten · {p} pers.": "{n} nights · {p} people", "{n} persoon": "{n} person", "{n} personen": "{n} people", "{n}× kamer voor 1": "{n}× single room", "{n}× kamer voor 2": "{n}× room for 2", "te voet de Fishermen's Trail heeft gelopen, van {a} naar {b}, over kliffen, door mul zand en langs een van de wildste kusten van Europa.": "walked the Fishermen's Trail on foot, from {a} to {b}, over cliffs, through soft sand and along one of the wildest coasts in Europe.", "te voet de Fishermen's Trail hebben gelopen, van {a} naar {b}, over kliffen, door mul zand en langs een van de wildste kusten van Europa.": "walked the Fishermen's Trail on foot, from {a} to {b}, over cliffs, through soft sand and along one of the wildest coasts in Europe.", "Voorproefje · prijzen en verblijven zijn voorbeelden": "Preview · prices and accommodation are examples", "De Fishermen's Trail, zonder gedoe.": "The Fishermen's Trail, without the hassle.", "Elke boeking steunt": "Every booking supports", ", die de paden onderhoudt.": ", who maintain the paths.", "Wandelen": "Walking", "Over": "About", "Je wensen": "Your preferences", "Comfort voor alle nachten": "Comfort for every night", "Bagage": "Luggage", "Extra nachten": "Extra nights", "{n} loopdagen · {k} km · {m} nachten": "{n} walking days · {k} km · {m} nights", "Rustdag": "Rest day", "Aankomstdag": "Arrival day", "Ontbijt inbegrepen": "Breakfast included", "per nacht": "per night", "Wij zoeken een verblijf voor je": "We'll find a place for you", "richtprijs": "estimated price", "Finish": "Finish", "Over deze etappe": "About this stage", "Geen overnachting: na de finish reis je naar huis.": "No overnight stay: you travel home after the finish.", "Je boeking": "Your booking", "Aankomst": "Arrival", "Vertrek": "Departure", "Reserveren": "Reserve", "Nu nog niets betalen. Pas als alles bevestigd is.": "Nothing to pay now. Only once everything is confirmed.", "Je gegevens": "Your details", "Hostel": "Hostel", "Guesthouse": "Guesthouse", "Appartement": "Apartment", "Hotel": "Hotel", "ieder een eigen kamer": "a room each", "samen op een kamer": "sharing a room", "Ga met je muis over een etappe": "Hover over a stage", "Tik op een etappe": "Tap a stage", "Hele route": "Whole route", "Bekijk etappe": "View stage", "Vlieg mee over de etappe": "Fly along the stage", "Stop": "Stop", "Wat mensen vaak vergeten": "What people often forget", "Draag je elke dag bij je": "You carry this every day", "Zelf toevoegen": "Add your own", "Verwijderen": "Remove", "In je dagrugzak": "In your daypack", "Toevoegen": "Add", "Alles leegmaken": "Clear everything", "Printen": "Print", "Zelf toegevoegd": "Your own items", "In je koffer": "In your suitcase", "Parabéns!": "Parabéns!", "Alleen must-haves": "Must-haves only", "Wacht elke middag in je volgende verblijf": "Waits for you each afternoon at your next stay", "Bijvoorbeeld: oplader": "For example: charger", "Printen of opslaan als PDF": "Print or save as PDF", "Genoeg water": "Enough water", "Minstens 1,5 liter per dag: onderweg kun je bijna nergens bijvullen.": "At least 1.5 litres a day: there are hardly any places to refill along the way.", "Zon en wind": "Sun and wind", "Er is vrijwel geen schaduw. Factor 30+, een pet en een windjack.": "There is almost no shade. SPF 30+, a cap and a windbreaker.", "Zand in je schoenen": "Sand in your shoes", "Korte gamaschen schelen veel blaren op de mulle stukken.": "Short gaiters save a lot of blisters on the soft sandy stretches.", "Sluiten": "Close", "Vorige": "Previous", "Sfeerbeeld": "Impression", "1 foto": "1 photo", "{n} foto's": "{n} photos", "2 u 35 min": "2 h 35 min", "3 u 24 min": "3 h 24 min", "3 u 25 min": "3 h 25 min", "3 u 45 min": "3 h 45 min", "4 u 18 min": "4 h 18 min", "4 u 46 min": "4 h 46 min", "5 u 10 min": "5 h 10 min", "5 u 15 min": "5 h 15 min", "5 u 18 min": "5 h 18 min", "5 u 25 min": "5 h 25 min", "5 u 40 min": "5 h 40 min", "5 u 50 min": "5 h 50 min", "Aan de strandboulevard deel je hier mediterrane tapas met uitzicht op zee.": "On the beachfront promenade you can share Mediterranean tapas with a view of the sea.", "Aan het begin van de etappe naar Sagres, voorbij de rotonde, drink je hier nog koffie en eet je iets voor je vertrekt.": "At the start of the stage to Sagres, just past the roundabout, stop here for a coffee and a bite to eat before you set off.", "Aan het dorpsplein haal je hier taart en cake van zoete aardappel, en reviewers noemen ook salades en toast met geitenkaas.": "On the village square you can pick up sweet potato cake and tart, and reviewers also mention the salads and goat's cheese toast.", "Aankomst in vissersdorp Porto Covo": "Arriving in the fishing village of Porto Covo", "Aftersun": "After-sun", "Algarvische streekkeuken, met als specialiteit van het huis de octopus-cataplana met zoete aardappel uit Aljezur.": "Regional Algarve cooking; the house speciality is octopus cataplana with sweet potato from Aljezur.", "Almograve": "Almograve", "Baai onder het dorp Arrifana, binnen het natuurpark; hier eindigt etappe 7 en begint etappe 8. Het strand had in 2012 de Blauwe Vlag, en er zijn WC's.": "Bay below the village of Arrifana, inside the natural park; stage 7 ends and stage 8 begins here. The beach had a Blue Flag in 2012, and there are toilets.", "Baai van Baleeira en de lagune van Martinhal": "Baleeira Bay and the Martinhal lagoon", "Bankpas en wat contant geld": "Bank card and some cash", "Barranco da Pena Furada, een zandbaaitje met door de zee uitgesleten rotsvormen": "Barranco da Pena Furada, a small sandy cove with rock formations carved out by the sea", "Bij bagagevervoer: houd je aan het maximumgewicht dat we je doorgeven.": "If you're using luggage transfer, keep within the maximum weight we give you.", "Blarenpleisters en tape": "Blister plasters and tape", "Boven Praia do Camilo bij Ponta da Piedade, direct aan de laatste etappe, kies je hier al ruim veertig jaar je vis uit de vitrine.": "Right on the final stage, above Praia do Camilo near Ponta da Piedade, this restaurant has let diners pick their fish from the display for more than forty years.", "Cabo Sardão": "Cabo Sardão", "Cabo de São Vicente": "Cabo de São Vicente", "Check of wandelen gedekt is.": "Check that walking is covered.", "Chef Ana Moura kookt Alentejaanse streekgerechten in een open keuken, met een balkon boven de baai van Porto Covo.": "Chef Ana Moura cooks regional Alentejo dishes in an open kitchen, with a balcony overlooking the bay of Porto Covo.", "Dagrugzak (20–30 liter)": "Daypack (20–30 litres)", "De eerste 3 km volg je de Historische Route, alleen rood-wit gemarkeerd. Monte Clérigo is het enige punt onderweg met eten en drinken. Het rapen van percebes is van september tot december verboden. Arrifana heeft geen pinautomaat.": "For the first 3 km you follow the Historical Way, marked in red and white only. Monte Clérigo is the only place along the way with food and drink. Gathering percebes is prohibited from September to December. Arrifana has no cash machine.", "De kliffen langs de Fishermen's Trail": "The cliffs along the Fishermen's Trail", "De laatste etappe binnen het natuurpark, met wilde orchideeën, dwergpalmen, tijm en lavendel op de kliffen. Bij Boca do Rio steek je een permanente beek over. Erachter liggen het moeras Paul da Lontreira en de resten van een Romeinse villa met vissenzouterij en badhuis. Via het 17e-eeuwse fort van Almádena en het vissersdorp Burgau kom je in Luz.": "The last stage inside the natural park, with wild orchids, dwarf fan palms, thyme and lavender on the cliffs. At Boca do Rio you cross a year-round stream. Beyond it lie the Paul da Lontreira marsh and the remains of a Roman villa with a fish-salting works and bathhouse. The route then passes the 17th-century fort of Almádena and the fishing village of Burgau before reaching Luz.", "De romige rijst met scharlakengarnaal is hier het visitekaartje, met een cocktail erbij voor de zonsondergang.": "The creamy rice with scarlet prawns is the signature dish here, with a cocktail to go with the sunset.", "Dinosaurussporen ca. 200 m ten westen van de parkeerplaats in Salema": "Dinosaur footprints approx. 200 m west of the car park in Salema", "Direct aan de route bij het vissershaventje van Canal, zo'n 3 km voor Milfontes: ideaal om de lange etappe vanuit Porto Covo af te sluiten.": "Right on the route at the little fishing harbour of Canal, about 3 km before Milfontes: ideal for rounding off the long stage from Porto Covo.", "Dorp op de zuidoever van de Ribeira de Seixe, die hier de grens vormt tussen Alentejo en Algarve. De windmolen van Odeceixe is een van de weinige die nog draait en te bezoeken is, en vanaf de looppaden erbij kijk je over het dorp en de riviermonding. Het strand ligt ca. 3–3,5 km buiten het dorp.": "Village on the south bank of the Ribeira de Seixe, which here forms the border between the Alentejo and the Algarve. The Odeceixe windmill is one of the few that still turn and can be visited, and from the footpaths around it you look out over the village and the river mouth. The beach is about 3–3.5 km outside the village.", "Dorpje Cavaleiro (km 9,5)": "The hamlet of Cavaleiro (km 9.5)", "Download de route vooraf; bereik is niet overal goed.": "Download the route beforehand; mobile reception isn't good everywhere.", "Drie paar, en 's avonds wassen.": "Three pairs, and wash them in the evening.", "Een afwisselende dag langs de stranden van Alteirinhos, Carvalhal en Amália, naar de natuurlijke vissershaven van Azenha do Mar. In de kliffen zie je gesteentelagen die ooit horizontaal lagen en nu zijn opgeplooid, soms tot verticaal. Het hoogtepunt is het uitzicht vanaf Ponta em Branco over het strand van Odeceixe. Daarna loop je de laatste ca. 4 km over de weg naar het dorp.": "A varied day past the beaches of Alteirinhos, Carvalhal and Amália to the natural fishing harbour of Azenha do Mar. In the cliffs you can see rock layers that were once horizontal and have since been folded, some of them right up to vertical. The highlight is the view from Ponta em Branco over the beach of Odeceixe. After that you walk the last 4 km or so along the road to the village.", "Een deel van de route loopt over de weg. Op twee plekken kun je naar het strand, maar doe dat alleen als de zee rustig is; anders blijf je op de weg. Veel eetgelegenheden in São Torpes zijn in de winter dicht. Wandelaars noemen het stuk zanderig en zonder schaduw.": "Part of the route follows the road. In two places you can go down to the beach, but only do so if the sea is calm; otherwise stay on the road. Many places to eat in São Torpes are closed in winter. Walkers describe this section as sandy and without shade.", "Een groot plateau met diepe, door water uitgesleten leisteenravijnen, langs de stranden Amado, Murração en Manteiga en het zandbaaitje Barranco da Pena Furada. Je passeert de islamitische nederzetting Ponta do Castelo uit de 12e–13e eeuw, waar onder meer vishaken, harpoenen en een walvisbot zijn gevonden. In het voorjaar bloeien endemische planten, en in de ravijnen hoor je nachtegalen.": "A large plateau with deep slate ravines carved out by water, past the beaches of Amado, Murração and Manteiga and the small sandy cove of Barranco da Pena Furada. You pass the 12th–13th-century Islamic settlement of Ponta do Castelo, where finds include fish hooks, harpoons and a whale bone. In spring the endemic plants are in flower, and in the ravines you can hear nightingales.", "Een kortere dag met wijde uitzichten over Vila Nova de Milfontes en de monding van de Mira. Je steekt de rivier over via de brug of met een bootje, en loopt dan langs kliffen, stranden en duinen. Tussen maart en oktober nestelen gierzwaluwen langs de kust, en bij laagwater zie je de rietmoerassen in de rivierbochten.": "A shorter day with wide views over Vila Nova de Milfontes and the mouth of the Mira. You cross the river by the bridge or by small boat, then walk along cliffs, beaches and dunes. Between March and October swifts nest along the coast, and at low tide you can see the reedbeds in the bends of the river.", "Een rotskust met veel zeeleven": "A rocky coast teeming with marine life", "Een rustige inloopdag. Je laat het industriegebied rond Sines achter je en loopt het natuurpark van de Zuidwest-Alentejo en Costa Vicentina in. De kust is hier vooral rotsachtig, met strandjes, duinen en lage kliffen, en op de rotsen zie je soms octopus en moeraal in de zon drogen. Je komt uit op het marktplein van Porto Covo.": "A gentle warm-up day. You leave the industrial area around Sines behind you and walk into the Southwest Alentejo and Vicentine Coast Natural Park. The coast here is mostly rocky, with small beaches, dunes and low cliffs, and on the rocks you sometimes see octopus and moray eel drying in the sun. You come out on the market square of Porto Covo.", "Een van de bekendste stranden van Lagos, vaak het visitekaartje van de stad genoemd, met een paar restaurants.": "One of the best-known beaches in Lagos, often called the town's calling card, with a few restaurants.", "Er is vrijwel geen schaduw op de route.": "There is almost no shade on the route.", "Familierestaurant uit 1998 dat zijn vis dagelijks van de afslag in Sagres en Lagos haalt; je wijst zelf aan welke vis op de grill gaat.": "Family restaurant dating from 1998 that fetches its fish daily from the fish auctions in Sagres and Lagos; you point out which fish goes on the grill.", "Familievriendelijke bistro die de lokale keuken eert met regionale ingrediënten en persoonlijke bediening.": "Family-friendly bistro that celebrates local cooking with regional ingredients and personal service.", "Familiezaak met ruim 30 jaar geschiedenis in het centrum, vol schelp- en schaaldieren en met een terras.": "Family-run restaurant in the town centre with more than 30 years of history, a menu full of shellfish and a terrace.", "Fleece of dunne trui": "Fleece or light jumper", "Fort van Almádena (17e eeuw)": "Fort of Almádena (17th century)", "Forte de São Clemente en de monding van de Mira": "Forte de São Clemente and the mouth of the Mira", "Fortresten van Zavial op Ponta da Fisga": "Remains of the Zavial fort on Ponta da Fisga", "Fossielen en 'reuzenketels' in de rotsen tussen Luz en Ponta da Piedade": "Fossils and 'giant's kettles' in the rocks between Luz and Ponta da Piedade", "Gamaschen (gaiters)": "Gaiters", "Grens tussen Alentejo en Algarve bij Odeceixe": "Border between the Alentejo and the Algarve at Odeceixe", "Groot, rustig strand bij Carrapateira, bekend om zijn veelzijdige golven en daarom een vaste plek voor surf- en bodyboardwedstrijden voor beginners. Er zijn restaurants en WC's; de strandbar is in het laagseizoen dicht.": "Large, quiet beach near Carrapateira, known for its versatile waves and therefore a regular venue for surf and bodyboard competitions for beginners. There are restaurants and toilets; the beach bar is closed in the low season.", "Handig in mul zand en bij steile afdalingen naar een strand.": "Useful in soft sand and on steep descents to a beach.", "Handig om mee te nemen": "Handy to bring", "Het dorpsstrand van Sagres. De etappe eindigt bij een rotonde met uitzicht op deze baai, en de volgende dag begint hier de tocht naar Salema.": "The village beach of Sagres. The stage ends at a roundabout overlooking this bay, and the next day the walk to Salema starts here.", "Het eerste deel volgt de Historische Route (rood-wit). Daal bij Telheiro voorzichtig de houten trap af. Hier wordt met steenmannetjes gemarkeerd: zet omgevallen stapels terug. Tot de vuurtoren is er geen bevoorrading, en de voorzieningen bij de kaap zijn buiten het seizoen niet altijd open. Van de kaap naar Sagres (ca. 6 km) loop je grotendeels over of langs de weg; een bus of Uber kan ook.": "The first part follows the Historical Way (red and white). Take care going down the wooden steps at Telheiro. The route here is marked with cairns: rebuild any that have toppled over. There are no supplies until the lighthouse, and the facilities at the cape are not always open out of season. From the cape to Sagres (approx. 6 km) you mostly walk on or alongside the road; a bus or Uber is also an option.", "Het eerste strand ten zuiden van Zambujeira. Net daarna buigt het pad kort landinwaarts om een kwetsbaar gebied (Lombo do Asno) te ontzien.": "The first beach south of Zambujeira. Just after it the path briefly turns inland to avoid a sensitive area (Lombo do Asno).", "Het grote strand van Porto Covo, bekend om de zonsondergang.": "The big beach of Porto Covo, known for its sunsets.", "Het noordelijkste strand van de Algarve: een lange zandtong in de monding van de Seixe, tussen hoge kliffen, waar bij eb kleine lagunes ontstaan. Het strand heeft de Blauwe Vlag en wordt in het badseizoen bewaakt. In 2012 werd het gekozen tot een van de 7 Wonderen van Portugal.": "The northernmost beach in the Algarve: a long spit of sand in the mouth of the Seixe, between high cliffs, where small lagoons form at low tide. The beach has a Blue Flag and is lifeguarded during the bathing season. In 2012 it was voted one of the 7 Wonders of Portugal.", "Het officiële startpunt is het strand van São Torpes, bij het informatiebord van Rota Vicentina, net ten zuiden van havenstad Sines. Het water is hier warmer door de koelwaterlozing van een nabije centrale, en het strand trekt surfers. Vlak bij het strand staat het Padrão de São Torpes, een gedenkteken voor de heilige naar wie het strand is genoemd.": "The official starting point is the beach of São Torpes, at the Rota Vicentina information board, just south of the port town of Sines. The water here is warmer because of cooling water discharged from a nearby power station, and the beach attracts surfers. Close to the beach stands the Padrão de São Torpes, a monument to the saint after whom the beach is named.", "Het strand van Almograve, op een paar honderd meter van het dorp. Op de etappe naar Zambujeira loop je hier zo'n 500 m over het zand: de enige keer die dag dat je echt over het strand loopt.": "The beach of Almograve, a few hundred metres from the village. On the stage to Zambujeira you walk about 500 m over the sand here: the only time that day that you really walk on the beach.", "Het strand van Luz, bij het fort van Nossa Senhora da Luz en met een boulevard met bankjes. In de zomer is het een van de drukste stranden van de streek.": "The beach of Luz, by the fort of Nossa Senhora da Luz and with a promenade lined with benches. In summer it is one of the busiest beaches in the region.", "Hoge kliffen in de zoute oceaanwind, met meer dan twintig vogelsoorten, waaronder ooievaars die op de rotsen nestelen en slechtvalken. In het voorjaar is Cabo Sardão dé plek voor vogelaars. De eerste ca. 10 km gaan door diep duinzand. Via het dorpje Cavaleiro en de vissershaven van Entrada da Barca kom je bij de kapel van Zambujeira.": "High cliffs in the salty ocean wind, with more than twenty bird species, including storks nesting on the rocks and peregrine falcons. In spring Cabo Sardão is the place to be for birdwatchers. The first 10 km or so are on deep sand through the dunes. The route then passes the hamlet of Cavaleiro and the fishing harbour of Entrada da Barca before reaching the chapel of Zambujeira.", "Hoge kliffen met eeuwenoude gesteentelagen": "High cliffs with ancient rock layers", "Hoofdplaats van de gelijknamige gemeente in het zuidwesten van de Algarve, met zo'n 1000 inwoners. De kust van de gemeente valt tot aan Burgau in het natuurpark. Het dorp staat bekend om zijn percebes (eendenmossels), en de etappes starten en eindigen op het Largo da Igreja, het kerkplein.": "Main town of the municipality of the same name in the south-west of the Algarve, with around 1000 inhabitants. The municipality's coastline as far as Burgau lies within the natural park. The village is known for its percebes (goose barnacles), and the stages start and end on the Largo da Igreja, the church square.", "Hoofdplaats van de gemeente Aljezur in het noordwesten van de Algarve. De kust van de gemeente valt in het natuurpark, en het stadje kreeg al in 1280 stadsrechten. De etappes starten en eindigen voor de gemeentelijke markt.": "Main town of the municipality of Aljezur in the north-west of the Algarve. The municipality's coastline lies within the natural park, and the town was granted its charter as early as 1280. The stages start and end in front of the municipal market.", "Hoog op de klif boven het vissershaventje bij Praia do Amado kies je bij de ingang je vis, met uitzicht over de oceaan.": "High on the cliff above the little fishing harbour at Praia do Amado, you choose your fish at the entrance, with a view over the ocean.", "Hostels en guesthouses kunnen gehorig zijn.": "Hostels and guesthouses can be noisy.", "Ilha do Pessegueiro met zijn forten": "Ilha do Pessegueiro and its forts", "In de 'hoofdstad van de percebes' eet je die eendenmossels hier warm en vers gekookt; ook de gefrituurde moeraal is populair.": "In the 'percebes capital' you eat these goose barnacles warm and freshly boiled; the fried moray eel is also popular.", "Ingelopen! Zware bergschoenen zijn in het mulle zand eerder lastig.": "Broken in! Heavy walking boots are more of a hindrance than a help in soft sand.", "Islamitische nederzetting Ponta do Castelo": "Islamic settlement of Ponta do Castelo", "Italiaanse vis-streetfood in het centrum van Lagos: broodjes, tapas en gefrituurde vis, ook vegetarisch en veganistisch.": "Italian seafood street food in the centre of Lagos: sandwiches, tapas and fried fish, with vegetarian and vegan options too.", "Je begint met een pittige klim uit Aljezur en loopt daarna over de kliffen naar Praia de Monte Clérigo en de 'mythische' Ponta da Atalaia. Onderweg groeien geurige struiken en zeldzame endemische planten. Vlak voor het eind ligt de Ribat van Arrifana, een islamitisch fort-klooster uit de 12e eeuw. De laatste ca. 3 km buigen landinwaarts af naar Arrifana.": "You start with a stiff climb out of Aljezur and then walk along the cliffs to Praia de Monte Clérigo and the 'mythical' Ponta da Atalaia. Fragrant shrubs and rare endemic plants grow along the way. Just before the end lies the Ribat of Arrifana, a 12th-century Islamic fortress-monastery. The last 3 km or so bear inland to Arrifana.", "Je loopt terug naar het strand van Odeceixe, nu aan de zuidkant, en volgt vissers­paden langs geïrrigeerde akkers en kustheide richting Aljezur. In de rietmoerassen zitten blauwe reigers en grote zilverreigers, en volgens Rota Vicentina leeft hier ook de Cabrera-woelmuis, Europa's meest bedreigde knaagdier. Vanaf Rogil loop je samen met de Historische Route.": "You walk back to the beach of Odeceixe, now on the south side, and follow fishermen's paths past irrigated fields and coastal heath towards Aljezur. Grey herons and great egrets live in the reedbeds, and according to Rota Vicentina this is also home to the Cabrera vole, Europe's most endangered rodent. From Rogil the trail shares its path with the Historical Way.", "Je pauzeplek halverwege de lange etappe Arrifana–Carrapateira, met vers sinaasappelsap en regionale gerechten.": "Your halfway stop on the long Arrifana–Carrapateira stage, with fresh orange juice and regional dishes.", "Kaap São Vicente met vuurtoren": "Cape São Vicente with its lighthouse", "Kantachtige zandsteenduinen bij Praia do Farol": "Lace-like sandstone dunes at Praia do Farol", "Kiezelstrand van Aivados, met door de golven gevormde stenen": "Pebble beach of Aivados, with stones shaped by the waves", "Kijk bij Boca do Rio hoe de zee staat. Kun je niet oversteken, volg dan de alternatieve route (13,6 km, officieel 'Difficult'). Er zijn een paar korte maar soms steile klimmen, en de tweede helft is drukker. Neem een verrekijker mee, vooral voor de vroege ochtend.": "Check the sea conditions at Boca do Rio. If you can't cross, follow the alternative route (13.6 km, officially 'Difficult'). There are a few short but sometimes steep climbs, and the second half is busier. Bring binoculars, especially for the early morning.", "Kijk bij Praia do Amado en Praia da Murração hoe de zee staat. Kun je Murração (van zuid naar noord) niet over, neem dan de rondwandeling landinwaarts. Bij veel regen raadt Rota Vicentina de binnendoorvariant van de Historische Route aan (20,6 km). Na Amado is er tot Vila do Bispo niets te eten of te drinken. Rond km 7,5–8 volgt een steile, lange klim en afdaling.": "Check the sea conditions at Praia do Amado and Praia da Murração. If you can't cross Murração (from south to north), take the loop walk inland. In heavy rain Rota Vicentina recommends the inland variant of the Historical Way (20.6 km). After Amado there is nothing to eat or drink until Vila do Bispo. Around km 7.5–8 there is a long, steep climb and descent.", "Kleding": "Clothing", "Klein EHBO-setje": "Small first-aid kit", "Klein dorp in de parochie Bordeira (gemeente Aljezur), tussen de surfstranden Bordeira en Amado. Rondom loopt de rondwandeling Pontal da Carrapateira langs de kliffen. Etappes starten en eindigen op het Largo do Comércio, het dorpsplein.": "Small village in the parish of Bordeira (municipality of Aljezur), between the surf beaches of Bordeira and Amado. The Pontal da Carrapateira loop walk runs around it along the cliffs. Stages start and end on the Largo do Comércio, the village square.", "Klein kustdorp in de gemeente Odemira, met het strand op een paar honderd meter van het dorp. Rond het dorp liggen duinen, en er loopt ook een eigen rondwandeling, 'Dunas do Almograve'. De Fishermen's Trail start en eindigt hier bij de rotonde aan het begin van de Avenida da Praia.": "Small coastal village in the municipality of Odemira, with the beach a few hundred metres from the village. The village is surrounded by dunes, and it also has its own loop walk, 'Dunas do Almograve'. The Fishermen's Trail starts and ends here at the roundabout at the beginning of the Avenida da Praia.", "Klein strand dat sinds de omleiding van september 2025 niet meer direct aan de route ligt: het is nu een omweg van 600 m heen en terug.": "Small beach that is no longer directly on the route since the diversion of September 2025: it is now a 600 m detour there and back.", "Klein strand in een inham tussen de rotsen, met wat voorzieningen voor strandgasten. Het strandrestaurant (rond km 10) neemt alleen contant geld aan en is op dinsdag dicht.": "Small beach in an inlet between the rocks, with a few facilities for beachgoers. The beach restaurant (around km 10) only takes cash and is closed on Tuesdays.", "Klein vissersdorp aan de Alentejaanse kust, ongeveer 170 km ten zuiden van Lissabon, bekend om zijn stranden en zijn band met de zee. De naam verwijst waarschijnlijk naar de 'covo', een fuik voor kreeft en krab. Rond het centrale plein zitten veel restaurants en bars.": "Small fishing village on the Alentejo coast, about 170 km south of Lisbon, known for its beaches and its bond with the sea. The name probably refers to the 'covo', a trap for lobster and crab. There are plenty of restaurants and bars around the central square.", "Kleine Italiaan met Napolitaanse pizza's van lang gerezen deeg uit de houtoven.": "Small Italian serving Neapolitan pizzas from the wood-fired oven, made with slow-risen dough.", "Kleine baai tussen de rotsen, net ten oosten van Ingrina, met voorzieningen voor strandgasten. Op Ponta da Fisga erboven liggen de resten van een 18e-eeuws fort, en het strandrestaurant is op maandag dicht.": "Small bay between the rocks, just east of Ingrina, with facilities for beachgoers. On Ponta da Fisga above it lie the remains of an 18th-century fort, and the beach restaurant is closed on Mondays.", "Kleine cafés en eventuele toeristenbelasting soms alleen contant.": "Small cafés, and any tourist tax, are sometimes cash only.", "Kliffen bij Praia de Odeceixe": "Cliffs at Praia de Odeceixe", "Kliffen in oker, rood, grijs, wit en zwart, vol fossielen uit het Midden-Krijt, en bij Ponta das Ferrarias een oude vulkanische schoorsteen. Na Porto de Mós volgen de grotten, rotsbogen en zuilen van Ponta da Piedade. Daarna daal je af naar Lagos, het vertrekpunt van de Portugese ontdekkingsreizen. De route eindigt bij het treinstation.": "Cliffs in ochre, red, grey, white and black, full of fossils from the mid-Cretaceous, and at Ponta das Ferrarias an old volcanic chimney. After Porto de Mós come the caves, rock arches and pillars of Ponta da Piedade. Then you descend to Lagos, the starting point of the Portuguese voyages of discovery. The route ends at the railway station.", "Kliffen tot 100 m hoog, met gesteentelagen van meer dan 300 miljoen jaar oud, en kleine vissershavens onderweg. Na een stuk langs de weg om Arrifana uit te komen wordt het klimmen en dalen, zonder schaduw. Aan het eind steek je Praia da Bordeira over, waar de Ribeira da Bordeira in zee uitkomt, en loop je Carrapateira in.": "Cliffs up to 100 m high, with rock layers more than 300 million years old, and small fishing harbours along the way. After a stretch along the road to get out of Arrifana, it's a matter of climbing and descending, with no shade. At the end you cross Praia da Bordeira, where the Ribeira da Bordeira flows into the sea, and walk into Carrapateira.", "Koffie of lunch in de straatjes van Burgau": "Coffee or lunch in the little streets of Burgau", "Koop 's ochtends in het dorp; onderweg is er vaak niets.": "Stock up in the village in the morning; there's often nothing along the way.", "Korte gamaschen houden het zand uit je schoenen.": "Short gaiters keep the sand out of your shoes.", "Korte wandelbroek of -rok": "Hiking shorts or skirt", "Kustdorp in de gemeente Odemira, hoog op de kliffen. Etappes beginnen en eindigen bij de kapel Nossa Senhora do Mar. Ruim 4 km naar het noorden ligt het vissershaventje Entrada da Barca, waar de vis nog per afslag wordt verkocht.": "Coastal village in the municipality of Odemira, high on the cliffs. Stages start and end at the chapel of Nossa Senhora do Mar. Just over 4 km to the north lies the little fishing harbour of Entrada da Barca, where fish is still sold at auction.", "Kustplaats op de noordoever van de rivier de Mira, vlak bij de monding, binnen het natuurpark. Het Forte de São Clemente bewaakt de riviermond, en vanaf de steiger ernaast vaart een bootje naar de overkant. Volgens Rota Vicentina wordt de streek gevoed door zoete rivieren, beken en bronnen.": "Coastal town on the north bank of the River Mira, close to its mouth, within the natural park. The Forte de São Clemente guards the river mouth, and from the jetty next to it a small boat crosses to the other side. According to Rota Vicentina the area is fed by freshwater rivers, streams and springs.", "Lagos vanaf de trail": "Lagos from the trail", "Lang strand met fijn, licht zand, en het officiële startpunt van de trail. Het water is hier warmer door de koelwaterlozing van een nabije centrale, en Rota Vicentina noemt het een goede zwemplek. Ook surfers komen hier graag.": "Long beach with fine, light sand, and the official starting point of the trail. The water here is warmer because of cooling water discharged from a nearby power station, and Rota Vicentina calls it a good place to swim. Surfers like it here too.", "Lang strand met schoon, fris water, aan de noordkant veel zand en aan de zuidkant rotsen. Bij eb zie je daar zeesterren, krabben en octopussen in de spleten. Op ca. km 10 is dit het enige punt van de etappe met eten en drinken.": "Long beach with clean, cool water, sandy at the north end and rocky at the south end. At low tide you can see starfish, crabs and octopuses in the crevices there. At approx. km 10 this is the only place on the stage with food and drink.", "Lang zandstrand met mooie duinen bij Carrapateira, geliefd bij surfers. De Ribeira da Bordeira mondt hier uit, en die oversteek is het spannende slot van de etappe.": "Long sandy beach with beautiful dunes near Carrapateira, popular with surfers. The Ribeira da Bordeira flows into the sea here, and crossing it is the exciting finale of the stage.", "Lange broek": "Long trousers", "Liefst lichtgekleurd en met lange mouw tegen de zon.": "Preferably light-coloured and long-sleeved, against the sun.", "Link naar je reisboekje": "Link to your travel guide", "Lippenbalsem met SPF": "Lip balm with SPF", "Lunch en snacks": "Lunch and snacks", "Met heupband, dat scheelt in het zand.": "With a hip belt, which makes a difference in the sand.", "Moeras Paul da Lontreira (ruim 100 ha riet), met purperreigers": "Paul da Lontreira marsh (over 100 ha of reeds), with purple herons", "Mooi strand waar je kunt kiezen: boven op de klif blijven, of bij laagwater over het strand lopen. De strandvariant eindigt met een goed te doen klim aan een touw.": "Beautiful beach where you can choose: stay up on the cliff, or walk along the beach at low tide. The beach variant ends with a manageable climb up a rope.", "Neem gezelschap mee, want de vis- en schaaldiergerechten zijn hier altijd om te delen.": "Come with friends, because the fish and seafood dishes here are always for sharing.", "Octopus en moeraal die volgens oude traditie in de zon drogen": "Octopus and moray eel drying in the sun, following an old tradition", "Ondergoed": "Underwear", "Onderweg kom je weinig tappunten of cafés tegen. Vul bij elke kans bij.": "You'll come across few water taps or cafés along the way. Refill at every opportunity.", "Ontstaan uit Tasca do Celso en een Lissabonse pizzeria, met een groot terras en een hondvriendelijke tuin, op een paar stappen van de route.": "Born out of Tasca do Celso and a Lisbon pizzeria, with a large terrace and a dog-friendly garden, a few steps from the route.", "Ooievaars die op de kliffen nestelen": "Storks nesting on the cliffs", "Ooievaars en tapuiten op de kliffen, patrijzen en torenvalken op het plateau": "Storks and wheatears on the cliffs, partridges and kestrels on the plateau", "Oordopjes": "Earplugs", "Op de kliffen kan het fris zijn, zeker 's ochtends.": "It can be chilly on the cliffs, especially in the morning.", "Opgeplooide rotslagen en versteende zandkokers in de kliffen": "Folded rock layers and fossilised sand tubes in the cliffs", "Oversteek van Praia da Bordeira": "Crossing Praia da Bordeira", "Overzetbootje over de rivier, als alternatief voor de brug": "Small ferry boat across the river, as an alternative to the bridge", "Papieren & geld": "Documents & money", "Pas extra op bij de afdalingen naar de stranden als het nat is; er liggen losse stenen. Strandbars kunnen in de winter dicht zijn, dus bevoorraad je in Sagres en neem genoeg water mee. Bij laagwater loop je makkelijk over het strand van Furnas naar Figueira; bij hoogwater is die doorsteek lastig. Wandelstokken zijn handig, zeker na regen; bij slecht weer kun je deze etappe beter overslaan. Het strandrestaurant van Ingrina is contant en op dinsdag dicht, dat van Zavial op maandag.": "Take extra care on the descents to the beaches when it's wet; there are loose stones. Beach bars may be closed in winter, so stock up in Sagres and bring enough water. At low tide you can easily walk along the beach from Furnas to Figueira; at high tide that shortcut is tricky. Walking poles are useful, especially after rain; in bad weather it's better to skip this stage. The beach restaurant at Ingrina is cash only and closed on Tuesdays, the one at Zavial on Mondays.", "Paspoort of ID-kaart": "Passport or ID card", "Percebes (eendenmossels), een lokale delicatesse": "Percebes (goose barnacles), a local delicacy", "Persoonlijke medicijnen": "Personal medication", "Pet of hoed met klep": "Cap or hat with a brim", "Pizzeria in een verbouwde oude ijsfabriek, in 2025 op plek 32 van de 50 beste pizzeria's van Europa.": "Pizzeria in a converted old ice factory, ranked 32nd among the 50 best pizzerias in Europe in 2025.", "Pleisters, desinfectie, pincet.": "Plasters, disinfectant, tweezers.", "Ponta da Atalaia": "Ponta da Atalaia", "Ponta da Piedade": "Ponta da Piedade", "Ponta da Piedade, met vuurtoren uit 1913": "Ponta da Piedade, with its lighthouse from 1913", "Porto Covo": "Porto Covo", "Powerbank": "Power bank", "Praia da Amália": "Praia da Amália", "Praia da Barriga": "Praia da Barriga", "Praia da Bordeira": "Praia da Bordeira", "Praia da Luz": "Praia da Luz", "Praia das Furnas": "Praia das Furnas", "Praia das Furnas (km 4)": "Praia das Furnas (km 4)", "Praia de Monte Clérigo (ca. km 10)": "Praia de Monte Clérigo (approx. km 10)", "Praia de Odeceixe": "Praia de Odeceixe", "Praia de São Torpes, met warmer zwemwater (lokaal het 'ketelstrand')": "Praia de São Torpes, with warmer water for swimming (known locally as the 'kettle beach')", "Praia do Amado, bekend surfstrand": "Praia do Amado, a well-known surf beach", "Praia do Malhão": "Praia do Malhão", "Praia do Queimado": "Praia do Queimado", "Praia do Telheiro, geologisch erfgoed": "Praia do Telheiro, a geological heritage site", "Regenjas of poncho": "Rain jacket or poncho", "Reisverzekering": "Travel insurance", "Restaurant met surfsfeer waar alles zelf wordt gemaakt, van het brood tot het langzaam gerookte vlees, met in de zomer vaak livemuziek.": "Restaurant with a surf vibe where everything is homemade, from the bread to the slow-smoked meat, often with live music in summer.", "Restaurant uit de Michelingids in Hotel Avenida, waar je aan de bar bij de open keuken zit of in de glazen eetzaal.": "Michelin Guide restaurant in Hotel Avenida, where you sit at the counter by the open kitchen or in the glass-walled dining room.", "Restaurante 44 in Alfambras, halverwege": "Restaurante 44 in Alfambras, halfway", "Ribat van Arrifana (12e eeuw)": "Ribat of Arrifana (12th century)", "Rogil, met goede restaurants halverwege": "Rogil, halfway, with good restaurants", "Romeinse amforaovens tussen Martinhal en Rebolinhos": "Roman amphora kilns between Martinhal and Rebolinhos", "Romeinse villa bij Praia da Boca do Rio": "Roman villa at Praia da Boca do Rio", "Roodgekleurd zandsteen vol sporen van vroegere klimaten": "Red sandstone full of traces of past climates", "Rota Vicentina meldt geen verversingspunten onderweg: neem minstens 1,5 l water en genoeg eten mee. Restaurante 44 halverwege is volgens reviews soms onverwacht dicht. Kijk bij Praia da Bordeira hoe de zee staat. Is oversteken onveilig, loop dan omhoog naar Pinhal do Bordalete en volg de weg naar Carrapateira; die alternatieve route is 21,7 km. Het eerste deel is de Historische Route (rood-wit). Smeer je goed in tegen de zon.": "Rota Vicentina lists no refreshment stops along the way: bring at least 1.5 litres of water and enough food. According to reviews, Restaurante 44 at the halfway point is sometimes unexpectedly closed. Check the sea conditions at Praia da Bordeira. If crossing is unsafe, walk up to Pinhal do Bordalete and follow the road to Carrapateira; that alternative route is 21.7 km. The first part follows the Historical Way (red and white). Put on plenty of sunscreen.", "Rota Vicentina noemt dit zelf een vermoeiende dag, vanwege de lengte en het bijna constante zand. Je loopt door de duinen van Ilha do Pessegueiro, Aivados en Malhão, langs verlaten baaitjes, donkere rotskusten en eilandjes die hier 'palheirões' heten. Van maart tot juni bloeit de kustflora, met dennen, rozemarijn en cistusroos die bijna plat tegen de grond groeien.": "Rota Vicentina itself calls this a tiring day, because of the length and the almost constant sand. You walk through the dunes of Ilha do Pessegueiro, Aivados and Malhão, past deserted coves, dark rocky shores and islets known here as 'palheirões'. From March to June the coastal flora is in bloom, with pines, rosemary and rockrose growing almost flat against the ground.", "Rugzak & onderweg": "Backpack & on the trail", "Rustig strand waar twee beken samenkomen. Aan de westkant liggen de resten van een Romeinse villa met vissenzouterij, mozaïeken en badhuis.": "Quiet beach where two streams meet. On the west side lie the remains of a Roman villa with a fish-salting works, mosaics and a bathhouse.", "Sagres betekent 'heilig'. Deze punt van het vasteland gold drie millennia lang als de grens van de bekende wereld, en het dorp is verbonden met het begin van de Portugese ontdekkingsreizen. Kaap São Vicente, het zuidwestelijkste punt van het Europese vasteland, ligt zo'n 7 km verderop.": "Sagres means 'sacred'. For three millennia this tip of the mainland was regarded as the edge of the known world, and the village is linked to the beginning of the Portuguese voyages of discovery. Cape São Vicente, the south-westernmost point of mainland Europe, lies about 7 km further on.", "Salema": "Salema", "Schoenen & voeten": "Shoes & feet", "Sinds 1974 de kantine van de vissers van Entrada da Barca, nu met zeezicht, vis van lokale vissers en een wijnkaart met kleine producenten.": "The canteen of the Entrada da Barca fishermen since 1974, now with sea views, fish from local fishermen and a wine list featuring small producers.", "Sinds 1974 eet je hier in een 17e-eeuws fort op de kaap boven de oceaan; de zondagse jazzlunch zit vaak ruim van tevoren vol.": "Open since 1974 in a 17th-century fort on the headland above the ocean; the Sunday jazz lunch is often fully booked well in advance.", "Sinds september 2025 is een deel van de oude route dicht door afkalvingsgevaar. Het nieuwe pad gaat over een houten brug over de Ribeira das Cobras, en Praia da Amália is nu een omweg van 600 m heen en terug. Ten zuiden van Alteirinhos maak je een korte omleiding landinwaarts rond een kwetsbaar gebied (Lombo do Asno): blijf op het pad. Voor eten ga je via een bewegwijzerde omweg van 2 km naar Brejão (km 6,5) of naar Azenha do Mar (km 9,5). De laatste ca. 4 km lopen over de weg; een taxi is een optie.": "Since September 2025 part of the old route has been closed because of the risk of cliff collapse. The new path crosses a wooden bridge over the Ribeira das Cobras, and Praia da Amália is now a 600 m detour there and back. South of Alteirinhos you make a short diversion inland around a sensitive area (Lombo do Asno): stay on the path. For food, take a signposted 2 km detour to Brejão (km 6.5) or to Azenha do Mar (km 9.5). The last 4 km or so follow the road; a taxi is an option.", "Slippers of sandalen": "Flip-flops or sandals", "Sneldrogend handdoekje": "Quick-dry towel", "Sneldrogende shirts": "Quick-dry shirts", "Staat op de achterkant van je zorgpas.": "Often on the back of your national health insurance card.", "Stad aan de monding van de Bensafrim en een van de meest bezochte plaatsen van de Algarve, bekend om zijn stranden en rotsformaties zoals Ponta da Piedade. Vanuit Lagos vertrokken de Portugese ontdekkingsreizen, en bij aankomst zie je het fort Ponta da Bandeira en het standbeeld van Infante Dom Henrique met sextant. Volgens Rota Vicentina een plek met veel nachtleven en visrestaurants.": "Town at the mouth of the Bensafrim and one of the most visited places in the Algarve, known for its beaches and rock formations such as Ponta da Piedade. The Portuguese voyages of discovery set out from Lagos, and on arrival you see the Ponta da Bandeira fort and the statue of Infante Dom Henrique (Henry the Navigator) with a sextant. According to Rota Vicentina, a place with plenty of nightlife and fish restaurants.", "Standbeeld van Infante Dom Henrique met sextant": "Statue of Infante Dom Henrique with a sextant", "Strand aan de baai van Baleeira, met tamarisken, kustmoerassen en de lagune van Martinhal, waar je vooral tijdens de trek veel vogels ziet. Tussen Martinhal en Rebolinhos liggen Romeinse ovens.": "Beach on Baleeira Bay, with tamarisks, coastal marshes and the Martinhal lagoon, where you see lots of birds, especially during migration. Between Martinhal and Rebolinhos lie Roman kilns.", "Strand aan de zuidoever van de Mira, op ca. km 4 vanaf Milfontes. Hier is het officiële verversingspunt van de etappe.": "Beach on the south bank of the Mira, about 4 km from Milfontes. This is the official refreshment stop on the stage.", "Strand met een bijzondere rotsformatie, geologisch erfgoed met opgeheven stranden, zandsteen van Silves en veel oudere leisteen. Je daalt af via een houten trap; surfers komen hier graag.": "Beach with a remarkable rock formation, a geological heritage site with raised beaches, Silves sandstone and much older slate. You go down a wooden staircase; surfers like it here.", "Strand met kiezels die door de golven zijn rondgeslepen, met daarachter de duinen waar het zandspoor langs loopt.": "Beach with pebbles rounded by the waves, backed by the dunes along which the sandy track runs.", "Strand na de lange klim en afdaling vanaf Luz, op ca. km 4, met een paar restaurants en een WC bij de toegangsweg.": "Beach after the long climb and descent from Luz, at approx. km 4, with a few restaurants and a toilet by the access road.", "Strand op ca. 3 km van Zambujeira, met een strandtentje dat elk jaar rond 1 maart opengaat en in het laagseizoen dicht is.": "Beach approx. 3 km from Zambujeira, with a small beach bar that opens around 1 March each year and is closed in the low season.", "Strand tegenover het eilandje Pessegueiro, dat al sinds de IJzertijd bewoond werd en in de Romeinse tijd een handelspost was. Op het eiland en op de wal staan forten uit eind 16e, begin 17e eeuw. Op km 3,5 is hier een verversingspunt, het laatste voor een tijd.": "Beach opposite the islet of Pessegueiro, which was already inhabited in the Iron Age and was a trading post in Roman times. There are forts from the late 16th and early 17th centuries on the island and on the shore. At km 3.5 there is a refreshment stop here, the last one for a while.", "Strand ten oosten van Boca do Rio, onder het 17e-eeuwse fort van Almádena, dat tegen piraten en kapers werd gebouwd.": "Beach east of Boca do Rio, below the 17th-century fort of Almádena, which was built as a defence against pirates and privateers.", "Strand van een actief vissersdorp: midden op het zand liggen de boten en hun vistuig, en je ziet ze terugkomen van zee. Zo'n 200 m ten westen van de parkeerplaats vind je dinosaurussporen.": "Beach of a working fishing village: the boats and their fishing gear lie in the middle of the sand, and you can watch them come back from sea. About 200 m west of the car park you'll find dinosaur footprints.", "Strandbar met snacks, sangria, cocktails en huisgemaakte taart.": "Beach bar with snacks, sangria, cocktails and homemade cake.", "Strandje bij Ponta da Piedade, met een restaurant erboven (zie Camilo bij de restaurants).": "Small beach near Ponta da Piedade, with a restaurant above it (see Camilo under the restaurants).", "Strandvariant bij Praia do Brejo Largo bij laagwater": "Beach variant at Praia do Brejo Largo at low tide", "Telefoon met offline kaart of GPX": "Phone with offline map or GPX", "Toiletspullen": "Toiletries", "Toilettas & EHBO": "Wash bag & first aid", "Traditionele Portugese keuken op 500 m van het strand, direct aan de route, waar je ook al ontbijt voor je vertrekt.": "Traditional Portuguese cooking 500 m from the beach, right on the route, where you can also have breakfast before you set off.", "Trailrunners of lichte wandelschoenen": "Trail runners or light hiking shoes", "Tussen Entrada do Pau en Ponta da Carraca buigt het pad door dennenbos landinwaarts, om een afkalvende kust heen: volg die omleiding. Na Entrada da Barca loop je ca. 1,5 km over de weg; je kunt de laatste 4 km ook met een taxi doen. Inkorten aan het begin: vanuit Almograve meteen naar het strand scheelt een half uur. Eten en drinken alleen in Cavaleiro (WC, café) en Entrada da Barca (twee restaurants, drinkfontein).": "Between Entrada do Pau and Ponta da Carraca the path bends inland through pine forest, around an eroding stretch of coast: follow this diversion. After Entrada da Barca you walk approx. 1.5 km along the road; you can also do the last 4 km by taxi. A shortcut at the start: heading straight for the beach from Almograve saves half an hour. Food and drink only in Cavaleiro (toilet, café) and Entrada da Barca (two restaurants, drinking fountain).", "Tussen Praia do Queimado en Malhão is het pad niet volledig gemarkeerd: volg het brede zandspoor langs de duinen van Aivados, Galé en Malhão, of loop alleen bij laagwater over het strand. Neem minstens 1,5 liter water mee. Je kunt iets eten of drinken bij Ilha do Pessegueiro (km 3,5), via een omweg van 1,8 km naar Ribeira da Azenha (km 6,5), en in de vissershaven van Canal (km 16). Inkorten kan: stop in Canal en neem een taxi (scheelt 3 km). Waar meerdere rondwandelingen samenkomen, let je extra op de bordjes.": "Between Praia do Queimado and Malhão the path is not fully waymarked: follow the wide sandy track along the dunes of Aivados, Galé and Malhão, or walk along the beach, but only at low tide. Bring at least 1.5 litres of water. You can get something to eat or drink at Ilha do Pessegueiro (km 3.5), via a 1.8 km detour to Ribeira da Azenha (km 6.5), and at the fishing harbour of Canal (km 16). You can shorten the stage: stop in Canal and take a taxi (saves 3 km). Where several loop walks meet, pay extra attention to the signs.", "Tussen dorp en strand eet je hier brunch, lunch of diner met uitzicht op de zonsondergang, met veganistische en glutenvrije opties.": "Between the village and the beach you can have brunch, lunch or dinner here with a view of the sunset, with vegan and gluten-free options.", "Twee stukken van ca. 500 m lopen over de berm van de weg: van de rotonde naar de verkeersbrug, en van de brug naar het houten hek bij Vila Formosa. Loop helemaal rechts en let extra op kinderen. Je kunt de brug vermijden met het bootje vanaf de steiger bij het fort; dat vaart zodra er genoeg mensen zijn. Sluit het hek bij Vila Formosa en houd op het terrein van Furnas afstand van het vee. Bij Brejo Largo kun je bij laagwater over het strand, met een klim aan een touw. Tussen de dorpen is weinig eten of water.": "Two stretches of approx. 500 m follow the verge of the road: from the roundabout to the road bridge, and from the bridge to the wooden gate at Vila Formosa. Keep well to the right and keep a close eye on children. You can avoid the bridge by taking the boat from the jetty by the fort; it leaves as soon as there are enough people. Close the gate at Vila Formosa and keep your distance from the livestock on the Furnas estate. At Brejo Largo you can walk along the beach at low tide, with a climb up a rope. There is little food or water between the villages.", "Uitzicht op Praia do Beliche": "View of Praia do Beliche", "Uitzicht over Meia Praia en het fort Ponta da Bandeira": "View over Meia Praia and the Ponta da Bandeira fort", "Uitzicht vanaf Ponta em Branco over Praia de Odeceixe": "View from Ponta em Branco over Praia de Odeceixe", "Van het dorp naar het strand loop je over de weg: blijf links, tegen het verkeer in. Eten en drinken op Praia de Odeceixe (km 3, april–september) en in Rogil. Vanaf Rogil volg je de rood-witte markering van de Historische Route. Het begin langs de weg en het laatste stuk naar Aljezur zijn lang en eentonig.": "From the village to the beach you walk along the road: keep left, facing the traffic. Food and drink at Praia de Odeceixe (km 3, April–September) and in Rogil. From Rogil you follow the red-and-white waymarks of the Historical Way. The start along the road and the last stretch to Aljezur are long and monotonous.", "Van het kerkplein van Vila do Bispo loop je eerst door boerenland en daarna over de winderige kliffen naar Praia do Telheiro en Kaap São Vicente, ooit 'het einde van de bekende wereld'. Deze kust is sinds 1988 biogenetisch reservaat met endemische planten. Je ziet er veel zeevogels, en bij goed weer vaak dolfijnen. Vanaf de vuurtoren loop je door naar Sagres.": "From the church square in Vila do Bispo you first walk through farmland and then along the windswept cliffs to Praia do Telheiro and Cape São Vicente, once 'the end of the known world'. Since 1988 this coast has been a biogenetic reserve with endemic plants. You'll see plenty of seabirds, and in good weather often dolphins. From the lighthouse you walk on to Sagres.", "Vanaf Praia da Luz begin je met een lange, steile klim naar de kliftop. Rond Ponta da Piedade loop je veel over plankenpaden. WC's bij Praia da Luz, Porto de Mós (toegangsweg), Ponta da Piedade, de Avenida dos Descobrimentos, de Marina en het treinstation.": "From Praia da Luz you start with a long, steep climb to the top of the cliffs. Around Ponta da Piedade much of the walking is on boardwalks. Toilets at Praia da Luz, Porto de Mós (access road), Ponta da Piedade, the Avenida dos Descobrimentos, the Marina and the railway station.", "Vegetarisch restaurant met glutenvrije boekweitpizza's en veganistische salades en taarten zonder geraffineerde suiker.": "Vegetarian restaurant with gluten-free buckwheat pizzas, and vegan salads and cakes without refined sugar.", "Verspreid liggend dorp boven Praia da Arrifana, in de gemeente Aljezur. Bij het dorp liggen de resten van de Ribat van Arrifana, een islamitisch kustfort-klooster uit ca. 1130, het enige dat in Portugal is teruggevonden. De etappes starten en eindigen bovenaan het strand.": "Scattered village above Praia da Arrifana, in the municipality of Aljezur. Near the village are the remains of the Ribat of Arrifana, an Islamic coastal fortress-monastery from around 1130, the only one ever found in Portugal. The stages start and end at the top of the beach.", "Vissersdorp in de gemeente Vila do Bispo, met kronkelende straatjes en witte huizen, nog binnen het natuurpark. Midden op het strand liggen de vissersboten en hun vistuig, en je kunt de boten zien terugkomen. Zo'n 200 m ten westen van de parkeerplaats bij het strand zie je dinosaurussporen.": "Fishing village in the municipality of Vila do Bispo, with winding little streets and white houses, still within the natural park. The fishing boats and their gear lie in the middle of the beach, and you can watch the boats come back in. About 200 m west of the car park by the beach you can see dinosaur footprints.", "Vissershaven Entrada da Barca (km 18)": "Fishing harbour of Entrada da Barca (km 18)", "Vissershaventje Azenha do Mar (km 9,5)": "Little fishing harbour of Azenha do Mar (km 9.5)", "Vissershaventje Canal vlak voor Milfontes": "Little fishing harbour of Canal, just before Milfontes", "Vissershaventjes langs de kust": "Little fishing harbours along the coast", "Vlonderpad bij Praia da Bordeira": "Boardwalk at Praia da Bordeira", "Volgens Rota Vicentina de zwaarste etappe van de Fishermen's Trail: steeds klimmen en dalen langs grote kalksteenkliffen en de stranden van Martinhal, Barranco, Ingrina, Zavial, Furnas, Figueira en Salema. Onderweg zie je Romeinse ovens, de lagune van Martinhal (goed voor vogels) en de resten van het 18e-eeuwse fort van Zavial. In Salema kun je bij het strand dinosaurussporen zoeken.": "According to Rota Vicentina, the toughest stage of the Fishermen's Trail: constant climbing and descending along great limestone cliffs and the beaches of Martinhal, Barranco, Ingrina, Zavial, Furnas, Figueira and Salema. Along the way you see Roman kilns, the Martinhal lagoon (good for birds) and the remains of the 18th-century fort of Zavial. In Salema you can look for dinosaur footprints by the beach.", "Volledig plantaardige bakkerij en keuken, waar je vroeg ontbijt of licht luncht en je koffie zelf tapt.": "Fully plant-based bakery and kitchen, where you can have an early breakfast or a light lunch and pour your own coffee.", "Voor 's avonds en op het strand.": "For the evenings and on the beach.", "Voor een duik in een baai onderweg.": "For a dip in a cove along the way.", "Voor koele avonden en tegen prikstruiken.": "For cool evenings, and to protect your legs from prickly shrubs.", "Vooral in het voor- en najaar.": "Especially in spring and autumn.", "Voormalig vissersdorp in de gemeente Lagos, nu een vakantieplaats rond een van de drukste stranden in de zomer. Bij het strand staan het fort van Nossa Senhora da Luz en Romeinse resten, en langs het water loopt een boulevard met bankjes. Lagos ligt op 7 km.": "Former fishing village in the municipality of Lagos, now a holiday resort around one of the busiest beaches in summer. By the beach stand the fort of Nossa Senhora da Luz and Roman remains, and a promenade with benches runs along the water. Lagos is 7 km away.", "Vuurtoren en kliffen van Cabo Sardão": "Lighthouse and cliffs of Cabo Sardão", "Wandelsokken": "Hiking socks", "Wandelstokken": "Walking poles", "Waslijntje en knijpers": "Washing line and pegs", "Water: minimaal 1,5–2 liter": "Water: at least 1.5–2 litres", "Waterval bij Praia da Amália": "Waterfall at Praia da Amália", "Werkende windmolen van Odeceixe, met uitzicht over de monding van de Seixe": "Working windmill of Odeceixe, with a view over the mouth of the Seixe", "Wil je een avond uitpakken, dan kies je bij dit restaurant uit de Michelingids met hedendaagse Portugese keuken een proefmenu van vier of zeven gangen.": "If you want to treat yourself one evening, choose a tasting menu of four or seven courses at this Michelin Guide restaurant serving contemporary Portuguese cuisine.", "Wind van zee, ook als de zon schijnt.": "Wind off the sea, even when the sun is shining.", "Windjack": "Windproof jacket", "Zachte reistas of koffer": "Soft travel bag or suitcase", "Zand + warmte = blaren. Plak bij de eerste schuurplek.": "Sand + heat = blisters. Tape up at the first sign of rubbing.", "Zandstrand dat volgens Rota Vicentina steeds een beetje van vorm verandert. Tussen Queimado en Malhão volg je het brede zandspoor langs de duinen, of je loopt bij laagwater over het strand.": "Sandy beach that, according to Rota Vicentina, keeps changing shape a little. Between Queimado and Malhão you follow the wide sandy track along the dunes, or you walk along the beach at low tide.", "Zandstrand onderin een kleine baai in de kliffen tussen de kaap en Sagres, bereikbaar via een lange trap. In het badseizoen is er strandwacht, en het is een bekende surfplek met korte, krachtige golven.": "Sandy beach at the bottom of a small bay in the cliffs between the cape and Sagres, reached by a long staircase. There are lifeguards in the bathing season, and it is a well-known surf spot with short, powerful waves.", "Zeevogels, en bij goed weer dolfijnen": "Seabirds, and dolphins in good weather", "Zet hem op je beginscherm.": "Add it to your home screen.", "Zon, wind & regen": "Sun, wind & rain", "Zonnebrand (factor 30+)": "Sunscreen (SPF 30+)", "Zonnebril": "Sunglasses", "Zorgpas (EHIC)": "European Health Insurance Card (EHIC)", "Zwemkleding": "Swimwear", "brunch, of 's avonds een burger": "brunch, or a burger in the evening", "brunch, of garnalen met sperziebonen en zoete-aardappelfrietjes": "brunch, or prawns with green beans and sweet potato fries", "cake of taart van zoete aardappel": "sweet potato cake or tart", "cataplana van octopus met zoete aardappel uit Aljezur (om te delen)": "octopus cataplana with sweet potato from Aljezur (for sharing)", "gaffelkabeljauw met venusschelpen in groene saus, of migas met ch   function maakEtappeKaart(lib, nr) {
    var et = etappe(nr), pts = lijnVan(et);
    basisKaart(lib, 'livekaart', { bounds: grenzen(pts), fitBoundsOptions: { padding: 50 } }).then(function (map) {
      // De andere etappes meteen (vaag), deze etappe tekent zichzelf in terracotta.

      map.addSource('deze', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: RUSTIG ? pts : [pts[0], pts[0]] } } });
      map.addLayer({ id: 'deze-gloed', type: 'line', source: 'deze', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#fff', 'line-width': 11, 'line-opacity': .9 } });
      map.addLayer({ id: 'deze', type: 'line', source: 'deze', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#c4522f', 'line-width': 6 } });
      plaatsStippen(lib, map, [et.van, et.naar]);
      var mijnFotos = D.fotos.filter(function (f) { return f.etappe === nr && f.lat; });
      var bellen = fotoBellen(lib, map, mijnFotos);
      D.hotspots.filter(function (h) { return h.soort === 'strand' && h.lat && (h.etappe === nr || h.plaats === et.naar); }).forEach(function (h) {
        var el = document.createElement('div'); el.className = 'kaartstrand'; el.title = h.naam;
        new lib.Marker({ element: el }).setLngLat([h.lng, h.lat]).setPopup(new lib.Popup({ offset: 10, closeButton: false }).setText(h.naam)).addTo(map);
      });
      if (RUSTIG) { vliegNaar(map, et); toonBellen(bellen, function () { return true; }, true, 0); }
      else {
        var begin = null;
        requestAnimationFrame(function stap(nu) {
          if (huidigeKaart !== map) return;
          begin = begin || nu;
          var f = Math.min(1, (nu - begin) / 1800), n = Math.max(2, Math.round(pts.length * (1 - Math.pow(1 - f, 3))));
          map.getSource('deze').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: pts.slice(0, n) } });
          if (f < 1) requestAnimationFrame(stap); else { vliegNaar(map, et); toonBellen(bellen, function () { return true; }, true, 900); }
        });
      }
      var knop = document.getElementById('vliegmee'), bezig = false, kaartje = null, kaartjeTimer = null;
      function fotoKaartje(f) {

        if (!kaartje) { kaartje = document.createElement('button'); kaartje.type = 'button'; kaartje.className = 'vliegfoto'; map.getContainer().appendChild(kaartje); }
        kaartje.onclick = function () { openLichtbak(f); };
        kaartje.classList.remove('in'); void kaartje.offsetWidth;
        kaartje.innerHTML = '<span class="vf-beeld"><img src="' + img(f, true) + '" alt=""></span><span class="vf-tekst">' + e(t(f.bijschrift)) + '</span>';
        kaartje.classList.add('in');
        clearTimeout(kaartjeTimer); kaartjeTimer = setTimeout(function () { if (kaartje) kaartje.classList.remove('in'); }, 3800);
      }
      function stop() {
        bezig = false; knop.textContent = '▶ ' + t('Vlieg mee over de etappe');

      }
      ['mousedown', 'wheel', 'touchstart'].forEach(function (ev) { map.getCanvas().addEventListener(ev, function () { if (bezig) stop(); }, { passive: true }); });
      knop.addEventListener('click', function () {
        if (bezig) { stop(); return; }
        bezig = true; knop.textContent = '■ ' + t('Stop');
        var stapjes = pts.filter(function (_, i) { return i % 6 === 0; }).concat([pts[pts.length - 1]]), i = 0;
        // Bij welk stapje komt elke foto in beeld: het punt van de route dat er het dichtst bij ligt.
        var opStap = {};
        mijnFotos.forEach(function (f) {
          var beste = 0, min = Infinity;
          stapjes.forEach(function (p, j) { var d = afstandM(p, [f.lng, f.lat]); if (d < min) { min = d; beste = j; } });
          (opStap[beste] = opStap[beste] || []).push(f);

        toonBellen(bellen, function () { return false; });

          if (opStap[i]) fotoKaartje(opStap[i][0]);

  }

  function naPlannen() {
    var maxDagen = function () { return D.etappes.filter(function (x) { return x.volgorde >= P.start; }).length; };
    if (window.innerWidth < 900) document.getElementById('filters').open = false;
    function opnieuw(rust) { bewaar('plan', P); if (rust) tekenRustdagen(); tekenNachten(); }
    var pagina = document.getElementById('boekpagina');
    pagina.addEventListener('click', function (ev) {
      var k = ev.target.closest('[data-dorp]'); if (!k) return;
      var lijst = plaatsFotos(k.dataset.dorp); openLichtbak(lijst[0], lijst);
    });
    pagina.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el.id === 'z-start') { P.start = +el.value; P.loopdagen = Math.min(P.loopdagen, maxDagen()); document.getElementById('z-dagen').textContent = P.loopdagen; opnieuw(true); }
      else if (el.id === 'z-datum') { if (el.value) { P.startdatum = el.value; P.keuzes = {}; opnieuw(); } }
      else if (el.id === 'z-personen') { P.personen = +el.value; opnieuw(); }
      else if (el.name === 'niveau') { P.niveau = el.value; P.keuzes = {}; opnieuw(); }
      else if (el.name === 'kamers') { P.kamers = el.value; opnieuw(); }
      else if (['bagage', 'aankomst', 'finishnacht'].indexOf(el.name) !== -1) { P[el.name] = el.checked; opnieuw(); }
      else if (el.closest && el.closest('#rustdagen')) { P.rustdagen = [].slice.call(pagina.querySelectorAll('#rustdagen input:checked')).map(function (x) { return +x.value; }); opnieuw(); }
      else if (el.dataset && el.dataset.nacht) {
        P.keuzes = P.keuzes || {};
        if (el.value === P.niveau) delete P.keuzes[el.dataset.nacht]; else P.keuzes[el.dataset.nacht] = el.value;
        opnieuw();
      }
    });
    pagina.addEventListener('click', function (ev) {
      var k = ev.target.closest('[data-dagen],[data-reserveer],[data-terug]'); if (!k) return;
      if (k.dataset.dagen) {
        P.loopdagen = Math.max(1, Math.min(P.loopdagen + +k.dataset.dagen, maxDagen()));
        P.rustdagen = P.rustdagen.filter(function (x) { return x < P.loopdagen; });
        document.getElementById('z-dagen').textContent = P.loopdagen; opnieuw(true);
      } else if (k.hasAttribute('data-reserveer')) toonGegevens();
      else tekenNachten();
    });
    tekenRustdagen(); tekenNachten();
  }
