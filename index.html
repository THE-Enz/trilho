<script>
const DATA = {"inst": {"site_naam": "Sardine Trails", "beheerder_naam": "Rota Vicentina", "opslag_procent": 12.0, "servicekosten_procent": 5.0, "servicekosten_minimum": 15.0, "bagage_prijs": 18.0, "bijdrage": 5.0, "bijdrage_per": "boeking", "hoogseizoen": [6, 7, 8, 9], "min_dagen_vooruit": 14, "aanvraag_email": "tobiasvheerde@gmail.com", "bevestigingstermijn": "binnen 2 werkdagen", "richtprijs": {"budget": 35.0, "midden": 65.0, "luxe": 120.0}}, "etappes": [{"volgorde": 1, "van": "sao-torpes", "naar": "porto-covo", "km": 10.2, "uren": "2 u 35 min", "zwaarte": "makkelijk", "intro": "Een rustige inloopdag. Je laat het industriegebied rond Sines achter je en loopt het natuurpark van de Zuidwest-Alentejo en Costa Vicentina in. De kust is hier vooral rotsachtig, met strandjes, duinen en lage kliffen, en op de rotsen zie je soms octopus en moeraal in de zon drogen. Je komt uit op het marktplein van Porto Covo.", "hoogtepunten": ["Praia de São Torpes, met warmer zwemwater (lokaal het 'ketelstrand')", "Een rotskust met veel zeeleven", "Octopus en moeraal die volgens oude traditie in de zon drogen", "Aankomst in vissersdorp Porto Covo"], "let_op": "Een deel van de route loopt over de weg. Op twee plekken kun je naar het strand, maar doe dat alleen als de zee rustig is; anders blijf je op de weg. Veel eetgelegenheden in São Torpes zijn in de winter dicht. Wandelaars noemen het stuk zanderig en zonder schaduw.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "porto-covo.jpg", "bijschrift": "Porto Covo", "maker": "Alvesgaspar", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Porto_Covo_August_2014-5b.jpg", "lat": 37.85653, "lng": -8.79411, "etappe": 1, "plaats": null}, {"bestand": "rotskust-bij-sao-torpes.jpg", "bijschrift": "Rotskust bij São Torpes", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Litoral_a_Sul_da_Praia_de_S%C3%A3o_Torpes_-_Portugal_(7764402106).jpg", "lat": 37.92402, "lng": -8.80541, "etappe": 1, "plaats": "sao-torpes"}]}, {"volgorde": 2, "van": "porto-covo", "naar": "vila-nova-de-milfontes", "km": 19.6, "uren": "5 u 15 min", "zwaarte": "zwaar", "intro": "Rota Vicentina noemt dit zelf een vermoeiende dag, vanwege de lengte en het bijna constante zand. Je loopt door de duinen van Ilha do Pessegueiro, Aivados en Malhão, langs verlaten baaitjes, donkere rotskusten en eilandjes die hier 'palheirões' heten. Van maart tot juni bloeit de kustflora, met dennen, rozemarijn en cistusroos die bijna plat tegen de grond groeien.", "hoogtepunten": ["Ilha do Pessegueiro met zijn forten", "Kiezelstrand van Aivados, met door de golven gevormde stenen", "Kantachtige zandsteenduinen bij Praia do Farol", "Vissershaventje Canal vlak voor Milfontes"], "let_op": "Tussen Praia do Queimado en Malhão is het pad niet volledig gemarkeerd: volg het brede zandspoor langs de duinen van Aivados, Galé en Malhão, of loop alleen bij laagwater over het strand. Neem minstens 1,5 liter water mee. Je kunt iets eten of drinken bij Ilha do Pessegueiro (km 3,5), via een omweg van 1,8 km naar Ribeira da Azenha (km 6,5), en in de vissershaven van Canal (km 16). Inkorten kan: stop in Canal en neem een taxi (scheelt 3 km). Waar meerdere rondwandelingen samenkomen, let je extra op de bordjes.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "praia-do-queimado.jpg", "bijschrift": "Praia do Queimado", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Queimado_Beach,_Fishermen%27s_Trail,_Porto_Covo,_Portugal_julesvernex2.jpg", "lat": 37.81406, "lng": -8.79436, "etappe": 2, "plaats": null}, {"bestand": "praia-do-malhao.jpg", "bijschrift": "Praia do Malhão", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_do_Malh%C3%A3o_-_Portugal_(44364280550).jpg", "lat": 37.78242, "lng": -8.80164, "etappe": 2, "plaats": null}, {"bestand": "begin-van-het-pad-bij-porto-covo.jpg", "bijschrift": "Begin van het pad bij Porto Covo", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Start_of_the_Fishermen%27s_Trail,_Porto_Covo,_Portugal_julesvernex2.jpg", "lat": 37.84783, "lng": -8.7929, "etappe": 2, "plaats": null}, {"bestand": "praia-do-malhao-in-bloei.jpg", "bijschrift": "Praia do Malhão in bloei", "maker": "21milo21", "licentie": "CC0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_do_Malh%C3%A3o_and_beautiful_view_with_flowers.jpg", "lat": 37.7773, "lng": -8.80298, "etappe": 2, "plaats": null}]}, {"volgorde": 3, "van": "vila-nova-de-milfontes", "naar": "almograve", "km": 14.6, "uren": "3 u 45 min", "zwaarte": "zwaar", "intro": "Een kortere dag met wijde uitzichten over Vila Nova de Milfontes en de monding van de Mira. Je steekt de rivier over via de brug of met een bootje, en loopt dan langs kliffen, stranden en duinen. Tussen maart en oktober nestelen gierzwaluwen langs de kust, en bij laagwater zie je de rietmoerassen in de rivierbochten.", "hoogtepunten": ["Forte de São Clemente en de monding van de Mira", "Overzetbootje over de rivier, als alternatief voor de brug", "Praia das Furnas (km 4)", "Strandvariant bij Praia do Brejo Largo bij laagwater"], "let_op": "Twee stukken van ca. 500 m lopen over de berm van de weg: van de rotonde naar de verkeersbrug, en van de brug naar het houten hek bij Vila Formosa. Loop helemaal rechts en let extra op kinderen. Je kunt de brug vermijden met het bootje vanaf de steiger bij het fort; dat vaart zodra er genoeg mensen zijn. Sluit het hek bij Vila Formosa en houd op het terrein van Furnas afstand van het vee. Bij Brejo Largo kun je bij laagwater over het strand, met een klim aan een touw. Tussen de dorpen is weinig eten of water.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "almograve.jpg", "bijschrift": "Almograve", "maker": "Libânia Pereira", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Portugal_Almograve_(22931239134).jpg", "lat": 37.6565, "lng": -8.802, "etappe": 3, "plaats": null}, {"bestand": "angra-do-cozinhadouro.jpg", "bijschrift": "Angra do Cozinhadouro", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Near_Angra_do_Cozinhadouro_Beach,_Fishermen%27s_Trail,_VIla_Nova_de_Milfontes,_Portugal_julesvernex2.jpg", "lat": 37.69924, "lng": -8.7937, "etappe": 3, "plaats": null}, {"bestand": "nieuwsgierig-veulen-onderweg.jpg", "bijschrift": "Nieuwsgierig veulen onderweg", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Curious_chestnut_foal,_Fishermen%27s_Trail,_Almograve,_Portugal_julesvernex2.jpg", "lat": 37.65883, "lng": -8.79402, "etappe": 3, "plaats": null}]}, {"volgorde": 4, "van": "almograve", "naar": "zambujeira-do-mar", "km": 21.5, "uren": "5 u 50 min", "zwaarte": "gemiddeld", "intro": "Hoge kliffen in de zoute oceaanwind, met meer dan twintig vogelsoorten, waaronder ooievaars die op de rotsen nestelen en slechtvalken. In het voorjaar is Cabo Sardão dé plek voor vogelaars. De eerste ca. 10 km gaan door diep duinzand. Via het dorpje Cavaleiro en de vissershaven van Entrada da Barca kom je bij de kapel van Zambujeira.", "hoogtepunten": ["Vuurtoren en kliffen van Cabo Sardão", "Roodgekleurd zandsteen vol sporen van vroegere klimaten", "Dorpje Cavaleiro (km 9,5)", "Vissershaven Entrada da Barca (km 18)"], "let_op": "Tussen Entrada do Pau en Ponta da Carraca buigt het pad door dennenbos landinwaarts, om een afkalvende kust heen: volg die omleiding. Na Entrada da Barca loop je ca. 1,5 km over de weg; je kunt de laatste 4 km ook met een taxi doen. Inkorten aan het begin: vanuit Almograve meteen naar het strand scheelt een half uur. Eten en drinken alleen in Cavaleiro (WC, café) en Entrada da Barca (twee restaurants, drinkfontein).", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "cabo-sardao.jpg", "bijschrift": "Cabo Sardão", "maker": "Aleksandr Zykov", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Cabo_Sard%C3%A3o,_Odemira_(32815031374).jpg", "lat": 37.5975, "lng": -8.816, "etappe": 4, "plaats": null}, {"bestand": "bij-praia-do-creleizao.jpg", "bijschrift": "Bij Praia do Creleizão", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Near_Creleiz%C3%A3o_Beach,_Fishermen%27s_Trail,_Zambujeira_do_Mar,_Portugal_julesvernex2.jpg", "lat": 37.58491, "lng": -8.81043, "etappe": 4, "plaats": null}, {"bestand": "afdaling-naar-baia-da-arquinha.jpg", "bijschrift": "Afdaling naar Baía da Arquinha", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Access_to_Ba%C3%ADa_da_Arquinha_Beach,_Fishermen%27s_Trail,_Zambujeira_do_Mar,_Portugal_julesvernex2.jpg", "lat": 37.53721, "lng": -8.78548, "etappe": 4, "plaats": null}]}, {"volgorde": 5, "van": "zambujeira-do-mar", "naar": "odeceixe", "km": 18.7, "uren": "5 u 40 min", "zwaarte": "zwaar", "intro": "Een afwisselende dag langs de stranden van Alteirinhos, Carvalhal en Amália, naar de natuurlijke vissershaven van Azenha do Mar. In de kliffen zie je gesteentelagen die ooit horizontaal lagen en nu zijn opgeplooid, soms tot verticaal. Het hoogtepunt is het uitzicht vanaf Ponta em Branco over het strand van Odeceixe. Daarna loop je de laatste ca. 4 km over de weg naar het dorp.", "hoogtepunten": ["Opgeplooide rotslagen en versteende zandkokers in de kliffen", "Vissershaventje Azenha do Mar (km 9,5)", "Uitzicht vanaf Ponta em Branco over Praia de Odeceixe", "Grens tussen Alentejo en Algarve bij Odeceixe"], "let_op": "Sinds september 2025 is een deel van de oude route dicht door afkalvingsgevaar. Het nieuwe pad gaat over een houten brug over de Ribeira das Cobras, en Praia da Amália is nu een omweg van 600 m heen en terug. Ten zuiden van Alteirinhos maak je een korte omleiding landinwaarts rond een kwetsbaar gebied (Lombo do Asno): blijf op het pad. Voor eten ga je via een bewegwijzerde omweg van 2 km naar Brejão (km 6,5) of naar Azenha do Mar (km 9,5). De laatste ca. 4 km lopen over de weg; een taxi is een optie.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "waterval-amalia.jpg", "bijschrift": "Waterval bij Praia da Amália", "maker": "Tiago J. G. Fernandes", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Cascata_-_Praia_da_Am%C3%A1lia_(2830865661).jpg", "lat": 37.48129, "lng": -8.79461, "etappe": 5, "plaats": null}, {"bestand": "praia-da-amalia.jpg", "bijschrift": "Praia da Amália", "maker": "Tiago J. G. Fernandes", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_da_Am%C3%A1lia_(2830877117).jpg", "lat": 37.48379, "lng": -8.79211, "etappe": 5, "plaats": null}, {"bestand": "praia-de-nossa-senhora.jpg", "bijschrift": "Praia de Nossa Senhora", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Nossa_Senhora_Beach,_Fishermen%27s_Trail,_Zambujeira_do_Mar,_Portugal_julesvernex2.jpg", "lat": 37.52899, "lng": -8.78658, "etappe": 5, "plaats": null}, {"bestand": "zonsondergang-bij-odeceixe.jpg", "bijschrift": "Zonsondergang bij Odeceixe", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Sunset_at_Odeceixe_Beach,_Fishermen%27s_Trail,_Odeceixe,_Portugal_julesvernex2-2.jpg", "lat": 37.44218, "lng": -8.79744, "etappe": 5, "plaats": null}]}, {"volgorde": 6, "van": "odeceixe", "naar": "aljezur", "km": 22.6, "uren": "5 u 50 min", "zwaarte": "zwaar", "intro": "Je loopt terug naar het strand van Odeceixe, nu aan de zuidkant, en volgt vissers­paden langs geïrrigeerde akkers en kustheide richting Aljezur. In de rietmoerassen zitten blauwe reigers en grote zilverreigers, en volgens Rota Vicentina leeft hier ook de Cabrera-woelmuis, Europa's meest bedreigde knaagdier. Vanaf Rogil loop je samen met de Historische Route.", "hoogtepunten": ["Werkende windmolen van Odeceixe, met uitzicht over de monding van de Seixe", "Kliffen bij Praia de Odeceixe", "Ooievaars die op de kliffen nestelen", "Rogil, met goede restaurants halverwege"], "let_op": "Van het dorp naar het strand loop je over de weg: blijf links, tegen het verkeer in. Eten en drinken op Praia de Odeceixe (km 3, april–september) en in Rogil. Vanaf Rogil volg je de rood-witte markering van de Historische Route. Het begin langs de weg en het laatste stuk naar Aljezur zijn lang en eentonig.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "odeceixe.jpg", "bijschrift": "Praia de Odeceixe", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_de_Odeceixe_-_Portugal_(24706738137).jpg", "lat": 37.44485, "lng": -8.79711, "etappe": 6, "plaats": null}, {"bestand": "het-pad-bij-odeceixe.jpg", "bijschrift": "Het pad bij Odeceixe", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Section_of_the_Fishermen%27s_Trail,_Odeceixe,_Portugal_julesvernex2.jpg", "lat": 37.42008, "lng": -8.80725, "etappe": 6, "plaats": null}]}, {"volgorde": 7, "van": "aljezur", "naar": "arrifana", "km": 17.1, "uren": "4 u 46 min", "zwaarte": "gemiddeld", "intro": "Je begint met een pittige klim uit Aljezur en loopt daarna over de kliffen naar Praia de Monte Clérigo en de 'mythische' Ponta da Atalaia. Onderweg groeien geurige struiken en zeldzame endemische planten. Vlak voor het eind ligt de Ribat van Arrifana, een islamitisch fort-klooster uit de 12e eeuw. De laatste ca. 3 km buigen landinwaarts af naar Arrifana.", "hoogtepunten": ["Praia de Monte Clérigo (ca. km 10)", "Ponta da Atalaia", "Ribat van Arrifana (12e eeuw)", "Percebes (eendenmossels), een lokale delicatesse"], "let_op": "De eerste 3 km volg je de Historische Route, alleen rood-wit gemarkeerd. Monte Clérigo is het enige punt onderweg met eten en drinken. Het rapen van percebes is van september tot december verboden. Arrifana heeft geen pinautomaat.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "ponta-da-atalaia.jpg", "bijschrift": "Ponta da Atalaia", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Ponta_da_Atalaia,_Fishermen%27s_Trail,_Aljezur,_Portugal_julesvernex2.jpg", "lat": 37.31995, "lng": -8.87584, "etappe": 7, "plaats": null}, {"bestand": "uitzicht-langs-de-kust.jpg", "bijschrift": "Uitzicht langs de kust", "maker": "21milo21", "licentie": "CC0", "bron": "https://commons.wikimedia.org/wiki/File:Spectacular_view_of_costline_in_Portugal.jpg", "lat": 37.33795, "lng": -8.85057, "etappe": 7, "plaats": null}, {"bestand": "arrifana-bij-zonsondergang.jpg", "bijschrift": "Arrifana bij zonsondergang", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Arrifana_Beach_at_sunset,_Fishermen%27s_Trail,_Odeceixe,_Portugal_julesvernex2.jpg", "lat": 37.29231, "lng": -8.86486, "etappe": 7, "plaats": null}]}, {"volgorde": 8, "van": "arrifana", "naar": "carrapateira", "km": 19.4, "uren": "5 u 10 min", "zwaarte": "gemiddeld", "intro": "Kliffen tot 100 m hoog, met gesteentelagen van meer dan 300 miljoen jaar oud, en kleine vissershavens onderweg. Na een stuk langs de weg om Arrifana uit te komen wordt het klimmen en dalen, zonder schaduw. Aan het eind steek je Praia da Bordeira over, waar de Ribeira da Bordeira in zee uitkomt, en loop je Carrapateira in.", "hoogtepunten": ["Hoge kliffen met eeuwenoude gesteentelagen", "Vissershaventjes langs de kust", "Oversteek van Praia da Bordeira", "Restaurante 44 in Alfambras, halverwege"], "let_op": "Rota Vicentina meldt geen verversingspunten onderweg: neem minstens 1,5 l water en genoeg eten mee. Restaurante 44 halverwege is volgens reviews soms onverwacht dicht. Kijk bij Praia da Bordeira hoe de zee staat. Is oversteken onveilig, loop dan omhoog naar Pinhal do Bordalete en volg de weg naar Carrapateira; die alternatieve route is 21,7 km. Het eerste deel is de Historische Route (rood-wit). Smeer je goed in tegen de zon.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "bordeira-vlonder.jpg", "bijschrift": "Vlonderpad bij Praia da Bordeira", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Bordeira_Beach,_Fishermen%27s_Trail,_Carrapateira,_Portugal_julesvernex2.jpg", "lat": 37.19747, "lng": -8.90627, "etappe": 8, "plaats": null}, {"bestand": "bordeira.jpg", "bijschrift": "Praia da Bordeira", "maker": "Pedro Ponce Asensio", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_da_Bordeira,_Carrapateira_(4).jpg", "lat": 37.203, "lng": -8.901, "etappe": 8, "plaats": null}, {"bestand": "ponta-da-carrapateira-bij-zonsondergang.jpg", "bijschrift": "Ponta da Carrapateira bij zonsondergang", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:RV_at_Ponta_da_Carrapateira,_Fishermen%27s_Trail,_Carrapateira,_Portugal_julesvernex2-2.jpg", "lat": 37.19362, "lng": -8.91422, "etappe": 8, "plaats": null}]}, {"volgorde": 9, "van": "carrapateira", "naar": "vila-do-bispo", "km": 15.3, "uren": "4 u 18 min", "zwaarte": "gemiddeld", "intro": "Een groot plateau met diepe, door water uitgesleten leisteenravijnen, langs de stranden Amado, Murração en Manteiga en het zandbaaitje Barranco da Pena Furada. Je passeert de islamitische nederzetting Ponta do Castelo uit de 12e–13e eeuw, waar onder meer vishaken, harpoenen en een walvisbot zijn gevonden. In het voorjaar bloeien endemische planten, en in de ravijnen hoor je nachtegalen.", "hoogtepunten": ["Praia do Amado, bekend surfstrand", "Islamitische nederzetting Ponta do Castelo", "Barranco da Pena Furada, een zandbaaitje met door de zee uitgesleten rotsvormen", "Ooievaars en tapuiten op de kliffen, patrijzen en torenvalken op het plateau"], "let_op": "Kijk bij Praia do Amado en Praia da Murração hoe de zee staat. Kun je Murração (van zuid naar noord) niet over, neem dan de rondwandeling landinwaarts. Bij veel regen raadt Rota Vicentina de binnendoorvariant van de Historische Route aan (20,6 km). Na Amado is er tot Vila do Bispo niets te eten of te drinken. Rond km 7,5–8 volgt een steile, lange klim en afdaling.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "praia-da-barriga.jpg", "bijschrift": "Praia da Barriga", "maker": "21milo21", "licentie": "CC0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_da_Barriga_at_the_morning.jpg", "lat": 37.122, "lng": -8.92689, "etappe": 9, "plaats": null}, {"bestand": "kliffen-bij-carrapateira.jpg", "bijschrift": "Kliffen bij Carrapateira", "maker": "Jules Verne Times Two", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:RV_at_Ponta_da_Carrapateira,_Fishermen%27s_Trail,_Carrapateira,_Portugal_julesvernex2.jpg", "lat": 37.19362, "lng": -8.91422, "etappe": 9, "plaats": null}]}, {"volgorde": 10, "van": "vila-do-bispo", "naar": "sagres", "km": 20.2, "uren": "5 u 18 min", "zwaarte": "gemiddeld", "intro": "Van het kerkplein van Vila do Bispo loop je eerst door boerenland en daarna over de winderige kliffen naar Praia do Telheiro en Kaap São Vicente, ooit 'het einde van de bekende wereld'. Deze kust is sinds 1988 biogenetisch reservaat met endemische planten. Je ziet er veel zeevogels, en bij goed weer vaak dolfijnen. Vanaf de vuurtoren loop je door naar Sagres.", "hoogtepunten": ["Praia do Telheiro, geologisch erfgoed", "Kaap São Vicente met vuurtoren", "Zeevogels, en bij goed weer dolfijnen", "Uitzicht op Praia do Beliche"], "let_op": "Het eerste deel volgt de Historische Route (rood-wit). Daal bij Telheiro voorzichtig de houten trap af. Hier wordt met steenmannetjes gemarkeerd: zet omgevallen stapels terug. Tot de vuurtoren is er geen bevoorrading, en de voorzieningen bij de kaap zijn buiten het seizoen niet altijd open. Van de kaap naar Sagres (ca. 6 km) loop je grotendeels over of langs de weg; een bus of Uber kan ook.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "cabo-sao-vicente.jpg", "bijschrift": "Cabo de São Vicente", "maker": "Matthias Süßen", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Cabo-sao-vicente-lighthouse-2019-msu-2309.jpg", "lat": 37.023, "lng": -8.9967, "etappe": 10, "plaats": null}, {"bestand": "startpunt-van-de-e9-bij-kaap-sint-vincen.jpg", "bijschrift": "Startpunt van de E9 bij Kaap Sint-Vincent", "maker": "MartinD", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:E9_hiking_route_starting_point_at_Cape_St_Vincent.jpg", "lat": 37.02333, "lng": -8.99553, "etappe": 10, "plaats": null}, {"bestand": "kliffen-bij-kaap-sint-vincent.jpg", "bijschrift": "Kliffen bij Kaap Sint-Vincent", "maker": "Jose A.", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Cabo_de_San_Vicente_(Portugal)_(25188494102).jpg", "lat": 37.02368, "lng": -8.99558, "etappe": 10, "plaats": null}]}, {"volgorde": 11, "van": "sagres", "naar": "salema", "km": 19.6, "uren": "5 u 25 min", "zwaarte": "zwaar", "intro": "Volgens Rota Vicentina de zwaarste etappe van de Fishermen's Trail: steeds klimmen en dalen langs grote kalksteenkliffen en de stranden van Martinhal, Barranco, Ingrina, Zavial, Furnas, Figueira en Salema. Onderweg zie je Romeinse ovens, de lagune van Martinhal (goed voor vogels) en de resten van het 18e-eeuwse fort van Zavial. In Salema kun je bij het strand dinosaurussporen zoeken.", "hoogtepunten": ["Baai van Baleeira en de lagune van Martinhal", "Romeinse amforaovens tussen Martinhal en Rebolinhos", "Fortresten van Zavial op Ponta da Fisga", "Dinosaurussporen ca. 200 m ten westen van de parkeerplaats in Salema"], "let_op": "Pas extra op bij de afdalingen naar de stranden als het nat is; er liggen losse stenen. Strandbars kunnen in de winter dicht zijn, dus bevoorraad je in Sagres en neem genoeg water mee. Bij laagwater loop je makkelijk over het strand van Furnas naar Figueira; bij hoogwater is die doorsteek lastig. Wandelstokken zijn handig, zeker na regen; bij slecht weer kun je deze etappe beter overslaan. Het strandrestaurant van Ingrina is contant en op dinsdag dicht, dat van Zavial op maandag.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "praia-das-furnas.jpg", "bijschrift": "Praia das Furnas", "maker": "21milo21", "licentie": "CC0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_das_Furnas_-_photo_of_cave.jpg", "lat": 37.05504, "lng": -8.85536, "etappe": 11, "plaats": null}, {"bestand": "salema.jpg", "bijschrift": "Salema", "maker": "Paul Wilkinson", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Salema,_Algarve,_Portugal_(20518471510).jpg", "lat": 37.0645, "lng": -8.824, "etappe": 11, "plaats": null}, {"bestand": "haven-van-sagres.jpg", "bijschrift": "Haven van Sagres", "maker": "Wikijennawiki", "licentie": "CC BY 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Boat_in_sagres.jpg", "lat": 37.011, "lng": -8.93281, "etappe": 11, "plaats": "sagres"}]}, {"volgorde": 12, "van": "salema", "naar": "luz", "km": 11.5, "uren": "3 u 24 min", "zwaarte": "gemiddeld", "intro": "De laatste etappe binnen het natuurpark, met wilde orchideeën, dwergpalmen, tijm en lavendel op de kliffen. Bij Boca do Rio steek je een permanente beek over. Erachter liggen het moeras Paul da Lontreira en de resten van een Romeinse villa met vissenzouterij en badhuis. Via het 17e-eeuwse fort van Almádena en het vissersdorp Burgau kom je in Luz.", "hoogtepunten": ["Romeinse villa bij Praia da Boca do Rio", "Moeras Paul da Lontreira (ruim 100 ha riet), met purperreigers", "Fort van Almádena (17e eeuw)", "Koffie of lunch in de straatjes van Burgau"], "let_op": "Kijk bij Boca do Rio hoe de zee staat. Kun je niet oversteken, volg dan de alternatieve route (13,6 km, officieel 'Difficult'). Er zijn een paar korte maar soms steile klimmen, en de tweede helft is drukker. Neem een verrekijker mee, vooral voor de vroege ochtend.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "praia-da-luz.jpg", "bijschrift": "Praia da Luz", "maker": "Marty B", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_da_Luz_from_the_Trilho_dos_Pescadores_(52859403419).jpg", "lat": 37.08806, "lng": -8.71355, "etappe": 12, "plaats": null}, {"bestand": "praia-da-salema.jpg", "bijschrift": "Praia da Salema", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_da_Salema_-_Portugal_(53503281113).jpg", "lat": 37.06542, "lng": -8.82302, "etappe": 12, "plaats": "salema"}]}, {"volgorde": 13, "van": "luz", "naar": "lagos", "km": 10.9, "uren": "3 u 25 min", "zwaarte": "makkelijk", "intro": "Kliffen in oker, rood, grijs, wit en zwart, vol fossielen uit het Midden-Krijt, en bij Ponta das Ferrarias een oude vulkanische schoorsteen. Na Porto de Mós volgen de grotten, rotsbogen en zuilen van Ponta da Piedade. Daarna daal je af naar Lagos, het vertrekpunt van de Portugese ontdekkingsreizen. De route eindigt bij het treinstation.", "hoogtepunten": ["Fossielen en 'reuzenketels' in de rotsen tussen Luz en Ponta da Piedade", "Ponta da Piedade, met vuurtoren uit 1913", "Uitzicht over Meia Praia en het fort Ponta da Bandeira", "Standbeeld van Infante Dom Henrique met sextant"], "let_op": "Vanaf Praia da Luz begin je met een lange, steile klim naar de kliftop. Rond Ponta da Piedade loop je veel over plankenpaden. WC's bij Praia da Luz, Porto de Mós (toegangsweg), Ponta da Piedade, de Avenida dos Descobrimentos, de Marina en het treinstation.", "actief": true, "bagage_prijs": null, "fotos": [{"bestand": "lagos.jpg", "bijschrift": "Lagos vanaf de trail", "maker": "Marty B", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Lagos_from_the_Trilho_dos_Pescadores_(52859404019).jpg", "lat": 37.08518, "lng": -8.69829, "etappe": 13, "plaats": null}, {"bestand": "ponta-da-piedade.jpg", "bijschrift": "Ponta da Piedade", "maker": "Theo Crazzolara", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Ponta_da_Piedade_(48462178692).jpg", "lat": 37.081, "lng": -8.669, "etappe": 13, "plaats": null}, {"bestand": "rocha-negra.jpg", "bijschrift": "Rocha Negra", "maker": "Marty B", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Rocha_Negra_on_the_Trilho_dos_Pescadores_(52859667238).jpg", "lat": 37.08662, "lng": -8.71838, "etappe": 13, "plaats": null}]}], "plaatsen": {"sao-torpes": {"naam": "São Torpes (Sines)", "lat": 37.927, "lng": -8.807, "intro": "Het officiële startpunt is het strand van São Torpes, bij het informatiebord van Rota Vicentina, net ten zuiden van havenstad Sines. Het water is hier warmer door de koelwaterlozing van een nabije centrale, en het strand trekt surfers. Vlak bij het strand staat het Padrão de São Torpes, een gedenkteken voor de heilige naar wie het strand is genoemd.", "rustdag_tips": [], "fotos": [{"bestand": "rotskust-bij-sao-torpes.jpg", "bijschrift": "Rotskust bij São Torpes", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Litoral_a_Sul_da_Praia_de_S%C3%A3o_Torpes_-_Portugal_(7764402106).jpg", "lat": 37.92402, "lng": -8.80541, "etappe": 1, "plaats": "sao-torpes"}, {"bestand": "de-kust-bij-sao-torpes.jpg", "bijschrift": "De kust bij São Torpes", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_de_S%C3%A3o_Torpes_-_Portugal_%F0%9F%87%B5%F0%9F%87%B9_(54881817901).jpg", "lat": 37.91627, "lng": -8.80568, "etappe": null, "plaats": "sao-torpes"}]}, "porto-covo": {"naam": "Porto Covo", "lat": 37.8519, "lng": -8.791, "intro": "Klein vissersdorp aan de Alentejaanse kust, ongeveer 170 km ten zuiden van Lissabon, bekend om zijn stranden en zijn band met de zee. De naam verwijst waarschijnlijk naar de 'covo', een fuik voor kreeft en krab. Rond het centrale plein zitten veel restaurants en bars.", "rustdag_tips": [], "fotos": [{"bestand": "porto-covo-2.jpg", "bijschrift": "Porto Covo", "maker": "Alvesgaspar", "licentie": "CC BY-SA 3.0", "bron": "https://commons.wikimedia.org/wiki/File:Porto_Covo_January_2011-1a.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "porto-covo"}, {"bestand": "de-kust-bij-porto-covo.jpg", "bijschrift": "De kust bij Porto Covo", "maker": "Paulrocha", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Porto_Covo,_Alentejo.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "porto-covo"}, {"bestand": "baai-in-porto-covo.jpg", "bijschrift": "Baai in Porto Covo", "maker": "Alvesgaspar", "licentie": "CC BY-SA 3.0", "bron": "https://commons.wikimedia.org/wiki/File:Porto_Covo_December_2013-2a.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "porto-covo"}]}, "vila-nova-de-milfontes": {"naam": "Vila Nova de Milfontes", "lat": 37.7263, "lng": -8.7805, "intro": "Kustplaats op de noordoever van de rivier de Mira, vlak bij de monding, binnen het natuurpark. Het Forte de São Clemente bewaakt de riviermond, en vanaf de steiger ernaast vaart een bootje naar de overkant. Volgens Rota Vicentina wordt de streek gevoed door zoete rivieren, beken en bronnen.", "rustdag_tips": [], "fotos": [{"bestand": "vila-nova-de-milfontes.jpg", "bijschrift": "Vila Nova de Milfontes", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Vila_Nova_de_Milfontes_-_Portugal_(48009793097).jpg", "lat": null, "lng": null, "etappe": null, "plaats": "vila-nova-de-milfontes"}, {"bestand": "de-rivier-de-mira.jpg", "bijschrift": "De rivier de Mira", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Vila_Nova_de_Milfontes_-_Portugal_(48890065421).jpg", "lat": 37.72018, "lng": -8.78849, "etappe": null, "plaats": "vila-nova-de-milfontes"}, {"bestand": "strand-aan-de-mira.jpg", "bijschrift": "Strand aan de Mira", "maker": "Rt44", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Southwest_Alentejo_and_Vicentine_Coast_Natural_Park,_Odemira,_Portugal_May_07,_2018_05-48-24.jpeg", "lat": 37.71922, "lng": -8.78977, "etappe": null, "plaats": "vila-nova-de-milfontes"}]}, "almograve": {"naam": "Almograve", "lat": 37.6531, "lng": -8.7926, "intro": "Klein kustdorp in de gemeente Odemira, met het strand op een paar honderd meter van het dorp. Rond het dorp liggen duinen, en er loopt ook een eigen rondwandeling, 'Dunas do Almograve'. De Fishermen's Trail start en eindigt hier bij de rotonde aan het begin van de Avenida da Praia.", "rustdag_tips": [], "fotos": [{"bestand": "praia-do-almograve.jpg", "bijschrift": "Praia do Almograve", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_do_Almograve_-_Portugal_(24617791858).jpg", "lat": 37.65082, "lng": -8.80278, "etappe": null, "plaats": "almograve"}, {"bestand": "kliffen-bij-almograve.jpg", "bijschrift": "Kliffen bij Almograve", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_do_Almograve_-_Portugal_(34475982244).jpg", "lat": 37.65445, "lng": -8.80171, "etappe": null, "plaats": "almograve"}, {"bestand": "de-kust-bij-almograve.jpg", "bijschrift": "De kust bij Almograve", "maker": "McGrain", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:K%C3%BCste_Almograve,_Portugal.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "almograve"}]}, "zambujeira-do-mar": {"naam": "Zambujeira do Mar", "lat": 37.5257, "lng": -8.7848, "intro": "Kustdorp in de gemeente Odemira, hoog op de kliffen. Etappes beginnen en eindigen bij de kapel Nossa Senhora do Mar. Ruim 4 km naar het noorden ligt het vissershaventje Entrada da Barca, waar de vis nog per afslag wordt verkocht.", "rustdag_tips": [], "fotos": [{"bestand": "zambujeira-do-mar.jpg", "bijschrift": "Zambujeira do Mar", "maker": "Otávio Nogueira", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Odemira_-_Zambujeira_do_Mar-3_(48885305532).jpg", "lat": null, "lng": null, "etappe": null, "plaats": "zambujeira-do-mar"}, {"bestand": "zambujeira-do-mar-op-de-kliffen.jpg", "bijschrift": "Zambujeira do Mar op de kliffen", "maker": "Otávio Nogueira", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Odemira_-_Zambujeira_do_Mar_(48885308782).jpg", "lat": null, "lng": null, "etappe": null, "plaats": "zambujeira-do-mar"}, {"bestand": "kapel-nossa-senhora-do-mar.jpg", "bijschrift": "Kapel Nossa Senhora do Mar", "maker": "Concierge.2C", "licentie": "CC BY-SA 3.0", "bron": "https://commons.wikimedia.org/wiki/File:Zambujeira_do_Mar_-_Capela_de_Nossa_Senhora_do_Mar.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "zambujeira-do-mar"}]}, "odeceixe": {"naam": "Odeceixe", "lat": 37.4342, "lng": -8.7694, "intro": "Dorp op de zuidoever van de Ribeira de Seixe, die hier de grens vormt tussen Alentejo en Algarve. De windmolen van Odeceixe is een van de weinige die nog draait en te bezoeken is, en vanaf de looppaden erbij kijk je over het dorp en de riviermonding. Het strand ligt ca. 3–3,5 km buiten het dorp.", "rustdag_tips": [], "fotos": [{"bestand": "odeceixe-2.jpg", "bijschrift": "Odeceixe", "maker": "Lolo7303", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Vue_d%27Odeceixe.jpg", "lat": 37.43143, "lng": -8.77176, "etappe": null, "plaats": "odeceixe"}, {"bestand": "strand-van-odeceixe.jpg", "bijschrift": "Strand van Odeceixe", "maker": "Lolo7303", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Plage_d%27Odeceixe.jpg", "lat": 37.43916, "lng": -8.79976, "etappe": null, "plaats": "odeceixe"}, {"bestand": "riviermonding-bij-odeceixe.jpg", "bijschrift": "Riviermonding bij Odeceixe", "maker": "Otávio Nogueira", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Aljezur_-_Odeceixe-2_(48890585527).jpg", "lat": null, "lng": null, "etappe": null, "plaats": "odeceixe"}]}, "aljezur": {"naam": "Aljezur", "lat": 37.3167, "lng": -8.8028, "intro": "Hoofdplaats van de gemeente Aljezur in het noordwesten van de Algarve. De kust van de gemeente valt in het natuurpark, en het stadje kreeg al in 1280 stadsrechten. De etappes starten en eindigen voor de gemeentelijke markt.", "rustdag_tips": [], "fotos": [{"bestand": "aljezur.jpg", "bijschrift": "Aljezur", "maker": "Bextrel", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Entrance_of_Aljezur_seen_from_the_Castle._14-03-2020.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "aljezur"}, {"bestand": "uitzicht-vanaf-het-kasteel-van-aljezur.jpg", "bijschrift": "Uitzicht vanaf het kasteel van Aljezur", "maker": "Marty B", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Panorama_of_Aljezur_from_the_castle_ruins_(52859623830).jpg", "lat": null, "lng": null, "etappe": null, "plaats": "aljezur"}]}, "arrifana": {"naam": "Arrifana", "lat": 37.2957, "lng": -8.8656, "intro": "Verspreid liggend dorp boven Praia da Arrifana, in de gemeente Aljezur. Bij het dorp liggen de resten van de Ribat van Arrifana, een islamitisch kustfort-klooster uit ca. 1130, het enige dat in Portugal is teruggevonden. De etappes starten en eindigen bovenaan het strand.", "rustdag_tips": [], "fotos": [{"bestand": "praia-da-arrifana.jpg", "bijschrift": "Praia da Arrifana", "maker": "Pepolino83", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_Arrifana_Sul_-_Parque_Natural_do_Sudoeste_Alentejano_e_Costa_Vicentina.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "arrifana"}, {"bestand": "vissershaventje-van-arrifana.jpg", "bijschrift": "Vissershaventje van Arrifana", "maker": "Txo", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Aljezur_Arrifana_puerto_1.jpg", "lat": 37.29529, "lng": -8.86961, "etappe": null, "plaats": "arrifana"}]}, "carrapateira": {"naam": "Carrapateira", "lat": 37.1836, "lng": -8.8953, "intro": "Klein dorp in de parochie Bordeira (gemeente Aljezur), tussen de surfstranden Bordeira en Amado. Rondom loopt de rondwandeling Pontal da Carrapateira langs de kliffen. Etappes starten en eindigen op het Largo do Comércio, het dorpsplein.", "rustdag_tips": [], "fotos": [{"bestand": "carrapateira.jpg", "bijschrift": "Carrapateira", "maker": "muffinn", "licentie": "CC BY 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Carrapateira_-_village_centre_(13463223895).jpg", "lat": null, "lng": null, "etappe": null, "plaats": "carrapateira"}, {"bestand": "carrapateira-op-de-heuvel.jpg", "bijschrift": "Carrapateira op de heuvel", "maker": "Filipe Rocha, Sacavem", "licentie": "CC BY-SA 3.0", "bron": "https://commons.wikimedia.org/wiki/File:Carrapateira_(Bordeira).jpg", "lat": null, "lng": null, "etappe": null, "plaats": "carrapateira"}]}, "vila-do-bispo": {"naam": "Vila do Bispo", "lat": 37.083, "lng": -8.9093, "intro": "Hoofdplaats van de gelijknamige gemeente in het zuidwesten van de Algarve, met zo'n 1000 inwoners. De kust van de gemeente valt tot aan Burgau in het natuurpark. Het dorp staat bekend om zijn percebes (eendenmossels), en de etappes starten en eindigen op het Largo da Igreja, het kerkplein.", "rustdag_tips": [], "fotos": [{"bestand": "vila-do-bispo.jpg", "bijschrift": "Vila do Bispo", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Vila_do_Bispo_-_Portugal_%F0%9F%87%B5%F0%9F%87%B9_(53717026114).jpg", "lat": 37.08145, "lng": -8.91141, "etappe": null, "plaats": "vila-do-bispo"}, {"bestand": "kerk-van-vila-do-bispo.jpg", "bijschrift": "Kerk van Vila do Bispo", "maker": "Elingunnur", "licentie": "CC BY 3.0", "bron": "https://commons.wikimedia.org/wiki/File:Igreja_de_Vila_do_Bispo.jpg", "lat": null, "lng": null, "etappe": null, "plaats": "vila-do-bispo"}]}, "sagres": {"naam": "Sagres", "lat": 37.0078, "lng": -8.9404, "intro": "Sagres betekent 'heilig'. Deze punt van het vasteland gold drie millennia lang als de grens van de bekende wereld, en het dorp is verbonden met het begin van de Portugese ontdekkingsreizen. Kaap São Vicente, het zuidwestelijkste punt van het Europese vasteland, ligt zo'n 7 km verderop.", "rustdag_tips": [], "fotos": [{"bestand": "sagres.jpg", "bijschrift": "Sagres", "maker": "Bextrel", "licentie": "CC BY-SA 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Sagres,_Algarve_-_11.03.2023.jpg", "lat": 37.01243, "lng": -8.94246, "etappe": null, "plaats": "sagres"}, {"bestand": "haven-van-sagres.jpg", "bijschrift": "Haven van Sagres", "maker": "Wikijennawiki", "licentie": "CC BY 4.0", "bron": "https://commons.wikimedia.org/wiki/File:Boat_in_sagres.jpg", "lat": 37.011, "lng": -8.93281, "etappe": 11, "plaats": "sagres"}, {"bestand": "fort-van-sagres.jpg", "bijschrift": "Fort van Sagres", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Fortaleza_de_Sagres_-_Portugal_(48906042846).jpg", "lat": 37.00064, "lng": -8.94769, "etappe": null, "plaats": "sagres"}]}, "salema": {"naam": "Salema", "lat": 37.0654, "lng": -8.8248, "intro": "Vissersdorp in de gemeente Vila do Bispo, met kronkelende straatjes en witte huizen, nog binnen het natuurpark. Midden op het strand liggen de vissersboten en hun vistuig, en je kunt de boten zien terugkomen. Zo'n 200 m ten westen van de parkeerplaats bij het strand zie je dinosaurussporen.", "rustdag_tips": [], "fotos": [{"bestand": "praia-da-salema.jpg", "bijschrift": "Praia da Salema", "maker": "Vitor Oliveira", "licentie": "CC BY-SA 2.0", "bron": "https://commons.wikimedia.org/wiki/File:Praia_da_Salema_-_Portugal_(53503281113).jpg", "lat": 37.06542, "lng": -8.82302, "etappe": 12, "plaats": "salema"}, {"bestand": "salema-2.jpg", "bijschrif et kiezels die door de golven zijn rondgeslepen, met daarachter de duinen waar het zandspoor langs loopt.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Lamelas", "plaats": "porto-covo", "etappe": null, "tekst": "Chef Ana Moura kookt Alentejaanse streekgerechten in een open keuken, met een balkon boven de baai van Porto Covo.", "tip": "gaffelkabeljauw met venusschelpen in groene saus, of migas met chorizo en spareribs", "prijs": "€€"}, {"soort": "strand", "naam": "Praia do Malhão", "plaats": null, "etappe": 2, "tekst": "Zandstrand dat volgens Rota Vicentina steeds een beetje van vorm verandert. Tussen Queimado en Malhão volg je het brede zandspoor langs de duinen, of je loopt bij laagwater over het strand.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "O Pescador", "plaats": "porto-covo", "etappe": null, "tekst": "Familiezaak met ruim 30 jaar geschiedenis in het centrum, vol schelp- en schaaldieren en met een terras.", "tip": "krab met geroosterd brood (de huisspecialiteit), of gefrituurde inktvis", "prijs": "€€"}, {"soort": "restaurant", "naam": "A.MAR (Costa do Vizir)", "plaats": "porto-covo", "etappe": null, "tekst": "De romige rijst met scharlakengarnaal is hier het visitekaartje, met een cocktail erbij voor de zonsondergang.", "tip": "romige rijst met scharlakengarnaal", "prijs": "€€"}, {"soort": "strand", "naam": "Praia das Furnas", "plaats": null, "etappe": 3, "tekst": "Strand aan de zuidoever van de Mira, op ca. km 4 vanaf Milfontes. Hier is het officiële verversingspunt van de etappe.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Manjedoura", "plaats": "vila-nova-de-milfontes", "etappe": null, "tekst": "Ontstaan uit Tasca do Celso en een Lissabonse pizzeria, met een groot terras en een hondvriendelijke tuin, op een paar stappen van de route.", "tip": "trilogie van Iberisch varken, of een pizza uit de houtoven", "prijs": "€€"}, {"soort": "strand", "naam": "Praia do Brejo Largo", "plaats": null, "etappe": 3, "tekst": "Mooi strand waar je kunt kiezen: boven op de klif blijven, of bij laagwater over het strand lopen. De strandvariant eindigt met een goed te doen klim aan een touw.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Porto das Barcas", "plaats": "vila-nova-de-milfontes", "etappe": null, "tekst": "Direct aan de route bij het vissershaventje van Canal, zo'n 3 km voor Milfontes: ideaal om de lange etappe vanuit Porto Covo af te sluiten.", "tip": "toast met sardines, ceviche van de dag of gegrilde vis", "prijs": "onb"}, {"soort": "strand", "naam": "Praia do Almograve (Longueirinha)", "plaats": null, "etappe": 4, "tekst": "Het strand van Almograve, op een paar honderd meter van het dorp. Op de etappe naar Zambujeira loop je hier zo'n 500 m over het zand: de enige keer die dag dat je echt over het strand loopt.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Cova Funda", "plaats": "almograve", "etappe": null, "tekst": "Traditionele Portugese keuken op 500 m van het strand, direct aan de route, waar je ook al ontbijt voor je vertrekt.", "tip": "gegrilde vis, of varkenswangen; 's ochtends ontbijt", "prijs": "€"}, {"soort": "strand", "naam": "Praia dos Alteirinhos", "plaats": null, "etappe": 5, "tekst": "Het eerste strand ten zuiden van Zambujeira. Net daarna buigt het pad kort landinwaarts om een kwetsbaar gebied (Lombo do Asno) te ontzien.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Bar da Praia (Beach Bar)", "plaats": "almograve", "etappe": null, "tekst": "Strandbar met snacks, sangria, cocktails en huisgemaakte taart.", "tip": "pica-pau van tonijn en zwart varken, met een sangria", "prijs": "€"}, {"soort": "strand", "naam": "Praia do Carvalhal", "plaats": null, "etappe": 5, "tekst": "Strand op ca. 3 km van Zambujeira, met een strandtentje dat elk jaar rond 1 maart opengaat en in het laagseizoen dicht is.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "A Barca Tranquitanas", "plaats": "zambujeira-do-mar", "etappe": null, "tekst": "Sinds 1974 de kantine van de vissers van Entrada da Barca, nu met zeezicht, vis van lokale vissers en een wijnkaart met kleine producenten.", "tip": "pompanofilets, of inktvis op Barca-wijze", "prijs": "€€"}, {"soort": "strand", "naam": "Praia da Amália", "plaats": null, "etappe": 5, "tekst": "Klein strand dat sinds de omleiding van september 2025 niet meer direct aan de route ligt: het is nu een omweg van 600 m heen en terug.", "tip": "", "prijs": ""}, {"soort": "strand", "naam": "Praia de Odeceixe", "plaats": null, "etappe": 6, "tekst": "Het noordelijkste strand van de Algarve: een lange zandtong in de monding van de Seixe, tussen hoge kliffen, waar bij eb kleine lagunes ontstaan. Het strand heeft de Blauwe Vlag en wordt in het badseizoen bewaakt. In 2012 werd het gekozen tot een van de 7 Wonderen van Portugal.", "tip": "", "prijs": ""}, {"soort": "strand", "naam": "Praia de Monte Clérigo", "plaats": null, "etappe": 7, "tekst": "Lang strand met schoon, fris water, aan de noordkant veel zand en aan de zuidkant rotsen. Bij eb zie je daar zeesterren, krabben en octopussen in de spleten. Op ca. km 10 is dit het enige punt van de etappe met eten en drinken.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Assomar", "plaats": "odeceixe", "etappe": null, "tekst": "Tussen dorp en strand eet je hier brunch, lunch of diner met uitzicht op de zonsondergang, met veganistische en glutenvrije opties.", "tip": "brunch, of garnalen met sperziebonen en zoete-aardappelfrietjes", "prijs": "onb"}, {"soort": "strand", "naam": "Praia da Arrifana", "plaats": null, "etappe": 7, "tekst": "Baai onder het dorp Arrifana, binnen het natuurpark; hier eindigt etappe 7 en begint etappe 8. Het strand had in 2012 de Blauwe Vlag, en er zijn WC's.", "tip": "", "prijs": ""}, {"soort": "strand", "naam": "Praia da Bordeira", "plaats": null, "etappe": 8, "tekst": "Lang zandstrand met mooie duinen bij Carrapateira, geliefd bij surfers. De Ribeira da Bordeira mondt hier uit, en die oversteek is het spannende slot van de etappe.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "näperõn", "plaats": "odeceixe", "etappe": null, "tekst": "Wil je een avond uitpakken, dan kies je bij dit restaurant uit de Michelingids met hedendaagse Portugese keuken een proefmenu van vier of zeven gangen.", "tip": "verrassingsmenu van 4 of 7 gangen", "prijs": "€€€"}, {"soort": "strand", "naam": "Praia do Amado", "plaats": null, "etappe": 9, "tekst": "Groot, rustig strand bij Carrapateira, bekend om zijn veelzijdige golven en daarom een vaste plek voor surf- en bodyboardwedstrijden voor beginners. Er zijn restaurants en WC's; de strandbar is in het laagseizoen dicht.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Trigo Vermelho", "plaats": "aljezur", "etappe": null, "tekst": "Vegetarisch restaurant met glutenvrije boekweitpizza's en veganistische salades en taarten zonder geraffineerde suiker.", "tip": "pizza van volkoren boekweit (glutenvrij)", "prijs": "€"}, {"soort": "restaurant", "naam": "Várzea Horta & Bistrot", "plaats": "aljezur", "etappe": null, "tekst": "Familievriendelijke bistro die de lokale keuken eert met regionale ingrediënten en persoonlijke bediening.", "tip": "garnalen 'à Brás', of tonijntataki", "prijs": "€€"}, {"soort": "strand", "naam": "Praia do Telheiro", "plaats": null, "etappe": 10, "tekst": "Strand met een bijzondere rotsformatie, geologisch erfgoed met opgeheven stranden, zandsteen van Silves en veel oudere leisteen. Je daalt af via een houten trap; surfers komen hier graag.", "tip": "", "prijs": ""}, {"soort": "cafe", "naam": "AREL", "plaats": "aljezur", "etappe": null, "tekst": "Volledig plantaardige bakkerij en keuken, waar je vroeg ontbijt of licht luncht en je koffie zelf tapt.", "tip": "zuurdesembrood of focaccia, met de dagsoep", "prijs": "€"}, {"soort": "strand", "naam": "Praia do Beliche", "plaats": null, "etappe": 10, "tekst": "Zandstrand onderin een kleine baai in de kliffen tussen de kaap en Sagres, bereikbaar via een lange trap. In het badseizoen is er strandwacht, en het is een bekende surfplek met korte, krachtige golven.", "tip": "", "prijs": ""}, {"soort": "strand", "naam": "Praia da Mareta", "plaats": null, "etappe": 10, "tekst": "Het dorpsstrand van Sagres. De etappe eindigt bij een rotonde met uitzicht op deze baai, en de volgende dag begint hier de tocht naar Salema.", "tip": "", "prijs": ""}, {"soort": "strand", "naam": "Praia do Martinhal", "plaats": null, "etappe": 11, "tekst": "Strand aan de baai van Baleeira, met tamarisken, kustmoerassen en de lagune van Martinhal, waar je vooral tijdens de trek veel vogels ziet. Tussen Martinhal en Rebolinhos liggen Romeinse ovens.", "tip": "", "prijs": ""}, {"soort": "cafe", "naam": "Microbar", "plaats": "carrapateira", "etappe": null, "tekst": "Aan het dorpsplein haal je hier taart en cake van zoete aardappel, en reviewers noemen ook salades en toast met geitenkaas.", "tip": "cake of taart van zoete aardappel", "prijs": "€"}, {"soort": "strand", "naam": "Praia da Ingrina", "plaats": null, "etappe": 11, "tekst": "Klein strand in een inham tussen de rotsen, met wat voorzieningen voor strandgasten. Het strandrestaurant (rond km 10) neemt alleen contant geld aan en is op dinsdag dicht.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Sítio do Forno", "plaats": "carrapateira", "etappe": null, "tekst": "Hoog op de klif boven het vissershaventje bij Praia do Amado kies je bij de ingang je vis, met uitzicht over de oceaan.", "tip": "vis van de dag (je kiest hem bij de ingang), of cataplana", "prijs": "€€"}, {"soort": "strand", "naam": "Praia do Zavial", "plaats": null, "etappe": 11, "tekst": "Kleine baai tussen de rotsen, net ten oosten van Ingrina, met voorzieningen voor strandgasten. Op Ponta da Fisga erboven liggen de resten van een 18e-eeuws fort, en het strandrestaurant is op maandag dicht.", "tip": "", "prijs": ""}, {"soort": "restaurant", "naam": "Restaurante 44", "plaats": "carrapateira", "etappe": null, "tekst"
